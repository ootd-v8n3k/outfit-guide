const CLOUD = 'M7,17h10.5a3.8,3.8 0 0 0 .3-7.6a5.4,5.4 0 0 0-10.3-1.1A4.4,4.4 0 0 0 7,17z';
function icon(code, night){
  const sun = '<circle cx="12" cy="12" r="4.2"/><path d="M12,2.5v2.4M12,19.1v2.4M2.5,12h2.4M19.1,12h2.4M5.3,5.3l1.7,1.7M17,17l1.7,1.7M5.3,18.7l1.7-1.7M17,7l1.7-1.7"/>';

const MAT = [[/생지/,['생지','#22304D']],[/샴브레이/,['연청','#8FA9C9']],[/코듀로이/,['브라운','#6B4E3D']],[/청바지|데님|\s진$/,['중청','#5A7BA6']],[/치노/,['베이지','#D8C7A8']],[/퍼티그|M-65|헌팅|N-3B/,['올리브','#5C5E3D']],[/스웨이드|데저트/,['샌드','#C8A77E']],[/캔버스|에코백/,['아이보리','#EEE9DF']],[/로퍼|보트슈즈|워크부츠|가죽 벨트|가죽 시계|레더 샌들|뿔테/,['브라운','#6B4E3D']],[/양말/,['화이트','#F4F4F2']],[/메탈|반지|목걸이/,['실버','#B8B8B8']],[/반다나/,['레드','#9E2B2B']],[/플리스|보아/,['크림','#EEE6D6']],[/알로하/,['그린','#2F4A3A']],[/더비|레인부츠|방한|방수|하이킹|첼시|서류/,['블랙','#1C1C1C']]];
const lum = h => { const v = [1,3,5].map(i => parseInt(h.substr(i,2),16)/255).map(c => c <= .03928 ? c/12.92 : Math.pow((c+.055)/1.055, 2.4)); return .2126*v[0] + .7152*v[1] + .0722*v[2]; };
function colorIn(s){ let best = null, bi = 1e9; for (const c of COL) { const i = s.indexOf(c[0]); if (i >= 0 && (i < bi || (i === bi && c[0].length > best[0].length))) { best = c; bi = i; } } return best; }
const matColor = s => { for (const [re, v] of MAT) if (re.test(s)) return v; return null; };
const known = s => colorIn(s) || matColor(s);
function far(pal, avoid){ if (!avoid.length) return pal[0]; let best = pal[0], bd = -1; for (const c of pal) { const d = Math.min(...avoid.map(h => Math.abs(lum(c[1]) - lum(h)))); if (d > bd) { bd = d; best = c; } } return best; }
const nameParts = n => { const m = n.match(/\(([^)]*)\)/); return {base: n.replace(/\s*\([^)]*\)/, '').trim(), paren: m ? m[1] : ''}; };

/* ---------- 착장 그림 ---------- */
const OL = '#2b2b2b', SK = '#E9E2DA', SO = '#b8ada1';
const MX = p => p.map(([x,y]) => [200-x, y]);
const D = p => 'M' + p.map(q => q[0] + ',' + q[1]).join('L') + 'Z';
// 검정·네이비처럼 아주 어두운 옷은 검은 윤곽선이 묻혀서 회색 선으로 그린다
const edge = f => f[0] === '#' && lum(f) < .07 ? '#8a8a8a' : OL;
const sh = (p, f) => `<path d="${D(p)}" fill="${f}" stroke="${edge(f)}" stroke-width="1" stroke-linejoin="round"/>`;
const sh2 = (p, f) => sh(p, f) + sh(MX(p), f);
const tx = (p, ids) => [].concat(ids || []).filter(Boolean).map(id => `<path d="${D(p)}" fill="url(#${id})"/>`).join('');
const tx2 = (p, ids) => tx(p, ids) + tx(MX(p), ids);
const ln = (d, c, w = 1) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
const mirD = d => d.replace(/(-?[\d.]+),(-?[\d.]+)/g, (m, x, y) => +(200 - +x).toFixed(1) + ',' + y);
const ln2 = (d, c, w) => ln(d, c, w) + ln(mirD(d), c, w);
const det = h => lum(h) < .2 ? 'rgba(255,255,255,.4)' : 'rgba(0,0,0,.3)';
// 주름·접힘처럼 봉제선보다 옅게 보여야 하는 선
const fold = h => lum(h) < .2 ? 'rgba(255,255,255,.2)' : 'rgba(0,0,0,.17)';
const T = (h, id) => id + (lum(h) < .2 ? 'L' : 'D');
const dot = (x, y, r, f) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;
// 명암: 왼쪽 조각은 바깥(왼쪽)이, 오른쪽 조각은 바깥(오른쪽)이 어둡고 가운데 몸판은 양옆이 어둡다
const vs = (p, id) => `<path d="${D(p)}" fill="url(#${id})"/>`;
const vsh = (p, f, t) => sh(p, f) + tx(p, t) + vs(p, 'vc');
const vsh2 = (p, f, t) => sh(p, f) + tx(p, t) + vs(p, 'vl') + sh(MX(p), f) + tx(MX(p), t) + vs(MX(p), 'vr');
// 박음질(점선)
const seam = (d, c, w = .7) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-dasharray="1.6 1.2" stroke-linecap="round"/>`;
const seam2 = (d, c, w) => seam(d, c, w) + seam(mirD(d), c, w);
// 곡선이 들어간 모양(path 문자열)을 좌우로 그린다
const shp2 = (d, f) => [d, mirD(d)].map(q => `<path d="${q}" fill="${f}" stroke="${edge(f)}" stroke-width="1" stroke-linejoin="round"/>`).join('');

function defs(){
  const pat = (id, w, h, b) => `<pattern id="${id}" width="${w}" height="${h}" patternUnits="userSpaceOnUse">${b}</pattern>`;
  const grad = (id, stops) => `<linearGradient id="${id}" x1="0" y1="0" x2="1" y2="0">${stops.map(([o, c, a]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join('')}</linearGradient>`;
  let s = grad('vl', [[0,'#000',.2],[.4,'#000',0],[.62,'#fff',.08],[.85,'#fff',0],[1,'#000',.07]])
    + grad('vr', [[0,'#000',.07],[.15,'#fff',0],[.38,'#fff',.08],[.6,'#000',0],[1,'#000',.2]])
    + grad('vc', [[0,'#000',.17],[.2,'#000',.02],[.5,'#fff',.06],[.8,'#000',.02],[1,'#000',.17]])
    + grad('gl', [[0,'#fff',0],[.45,'#fff',.35],[.55,'#fff',.35],[1,'#fff',0]]);
  for (const [k, c] of [['D','rgba(0,0,0,.2)'],['L','rgba(255,255,255,.26)']]) {
    s += pat('qt'+k, 40, 13, `<path d="M0,12.5H40" stroke="${c}"/>`)
      + pat('st'+k, 8, 6, `<path d="M0,5H8" stroke="${c}" stroke-width="1.6"/>`)
      + pat('ch'+k, 12, 12, `<path d="M0,3H12M0,9H12M3,0V12M9,0V12" stroke="${c}" stroke-width="1.3"/>`)
      + pat('rb'+k, 3, 10, `<path d="M1.5,0V10" stroke="${c}" stroke-width=".6"/>`)
      + pat('cb'+k, 10, 12, `<path d="M5,0Q8.5,3 5,6Q1.5,9 5,12" fill="none" stroke="${c}" stroke-width="1.2"/>`)
      + pat('rg'+k, 40, 20, `<rect y="10" width="40" height="10" fill="${c}"/>`)
      + pat('dt'+k, 5, 5, `<circle cx="2.5" cy="2.5" r=".8" fill="${c}"/>`);
  }
  return `<defs>${s}</defs>`;
}

// 상의 한 벌: 몸판 + 소매
function body(col, o){
  const w = o.wide, hem = o.hem;
  const sx = w ? 59 : 64, sy = w ? 80 : 76, ax = w ? 70 : 73;
  let L = [[90,66],[sx,sy],[ax,110],[w ? 74 : 76,196]];
  if (o.tuck === 'full') L = L.concat([[77,201],[100,201]]);
  else if (o.tuck === 'front') L = L.concat([[w ? 71 : 73,hem],[86,hem-1],[95,203],[100,201]]);
  else L = L.concat([[w ? 71 : 73,hem],[100,hem]]);
  const NK = {crew:[[106,71],[100,73],[94,71]], v:[[100,94]], deep:[[100,112]], shirt:[[100,79]], flat:[]}[o.neck || 'crew'];
  const poly = L.concat(MX(L).reverse(), NK);
  const dc = det(col), fc = fold(col);
  let s = '';
  if (o.sleeve !== 'none') {
    const sl = o.sleeve === 'short'
      ? (w ? [[sx,sy],[52,130],[71,133],[ax,110]] : [[sx,sy],[57,121],[71,124],[ax,108]])
      : (w ? [[sx,sy],[43,212],[63,215],[ax,112],[ax+2,90]] : [[sx,sy],[46,210],[61,213],[ax,108],[ax+1,88]]);
    s += vsh2(sl, col, o.tex);
    if (o.sleeve === 'long') {
      // 소매 끝(커프스·시보리)과 팔꿈치 안쪽 주름
      const cuff = w ? [[43.9,205],[63.5,208],[63,215],[43,212]] : [[46.9,203],[61.8,206],[61,213],[46,210]];
      if (o.rib) s += tx2(cuff, T(col,'rb'));
      s += ln2(w ? 'M43.9,205L63.5,208' : 'M46.9,203L61.8,206', dc, .8)
        + ln2(w ? 'M60,150Q64,153 66.6,149M59,158Q62,160.5 65.8,157' : 'M62.5,148Q66,151 68.2,147M61.5,156Q64.5,158.5 67.3,155', fc, .9);
    } else s += seam2(w ? 'M52.6,126L70.8,129' : 'M57.6,117L71.6,120', dc);

  // 롱패딩은 '바지·신발을 같은 어두운 색으로'가 핏 설명이라, 색이 안 정해진 바지·신발은 블랙으로 맞춘다
  const lp = sel.outer && sel.outer.f === 'longpad', BLK = ['블랙','#1C1C1C'];
  const bottomC = colorIn(bn.base) ? K.bottom : lp ? BLK : K.bottom || (byDark[0][1] === topC[1] ? byDark[1] : byDark[0]);
  const shoesC = colorIn(shoeP) ? K.shoes : lp ? BLK : K.shoes || byDark[0];
  const pointC = avoid => avoid.includes(accent[1]) ? far(pal, avoid) : accent;
  const extraC = en ? (K.extra || pointC([(outerC || topC)[1], bottomC[1]])) : null;
  const tieC = tieP ? (known(tieP) || pointC([topC[1], (shirtC || topC)[1]])) : null;

  // 상의
  const tk = topKind(mainP), f = sel.top.f;
  const ek = en ? extraKind(en.base) : null;
  const tuckable = ['shirt','polo','henley','crew','rugby'].includes(tk) && !shirtUnder && !/니트|맨투맨|스웻|플리스|울/.test(mainP);
  const tex = [];
  if (/케이블|피셔맨/.test(mainP)) tex.push(T(topC[1],'cb')); else if (/니트|울|모헤어|코위찬|베스트/.test(mainP)) tex.push(T(topC[1],'rb'));
  if (/스트라이프/.test(mainP)) tex.push(T(topC[1],'st'));
  if (/체크|플란넬/.test(mainP)) tex.push(T(topC[1],'ch'));
  if (tk === 'rugby') tex.push(T(topC[1],'rg'));
  if (/플리스|와플/.test(mainP)) tex.push(T(topC[1],'dt'));
  const P = {kind: tk, col: topC, short: /반팔|저지|알로하/.test(mainP), wide: f === 'over', hem: tk === 'shirt' ? 228 : 222, tex,
    tuck: (ek === 'belt' && tuckable) || (tk === 'shirt' && (mood === 'formal' || mood === 'preppy')) ? 'full'
      : (f === 'top' || f === 'over') && ['crew','henley','polo'].includes(tk) ? 'front' : '',
    shirtTuck: mood === 'formal' || mood === 'preppy',
    shirt: shirtUnder ? {col: shirtC, tex: /스트라이프/.test(shirtP) ? T(shirtC[1],'st') : /체크|플란넬/.test(shirtP) ? T(shirtC[1],'ch') : null} : null,
    tie: tieP ? {col: tieC, kind: /스키니/.test(tieP) ? 'skinny' : /니트/.test(tieP) ? 'knit' : 'std'} : null,
    tee: teeC ? {col: teeC} : null,
    graphic: /그래픽/.test(mainP) ? 'big' : /로고|프린팅|저지/.test(mainP) ? 'small' : null,
    band: /코위찬/.test(mainP), rib: /니트|맨투맨|스웻|후드티/.test(mainP)};
  // 겉옷: '가방에', '손에 들기'는 입지 않은 상태라 그림에서 뺀다
  const carry = on && /가방|손에/.test(on.paren);
  // 기장은 목록에 적힌 핏 설명(엉덩이 위·무릎 위 등)과 같게 그린다
  const OH = {short:214, coat:296, blazer:240, longpad:360};
  const ok = outerP ? outerKind(outerP) : null;
  const O = on && !carry ? {cfg: Object.assign({}, OCFG[ok], OH[sel.outer.f] ? {hem: OH[sel.outer.f]} : {}), col: outerC, name: outerP, kind: ok} : null;
  const Oin = O && innerP ? {cfg: OCFG.light, col: known(innerP) || byDark[0], name: innerP, kind: 'light'} : null;
  // 하의·신발
  const socks = sockP ? (known(sockP) || ['화이트','#F4F4F2']) : ek === 'socks' ? extraC : null;
  const bk = /조거|트랙 팬츠/.test(bn.base) ? 'jogger' : (sel.bottom.f || 'straight');
  const B = {kind: bk, col: bottomC, hem: bk === 'shorts' ? (/버뮤다/.test(bn.base) ? 292 : 284) : socks ? 390 : 398,
    tex: /코듀로이/.test(bn.base) ? T(bottomC[1],'rb') : null, cargo: /카고/.test(bn.base), track: /트랙/.test(bn.base), destroyed: /디스트로이드/.test(bn.base),
    jean: /데님|청바지|진$/.test(bn.base)};
  const S = {kind: shoeKind(shoeP), col: shoesC, name: shoeP, socks, short: bk === 'shorts'};
  const E = en ? {kind: ek, col: extraC, name: en.base, draw: !!ek && (ek !== 'belt' || P.tuck === 'full')} : null;

  // 목록. 이름에 색이 없어서 그림에 정해 넣은 색은 괄호로 밝힌다
  // 이름에 색 단어가 없는데 그림에 색을 정해 넣었으면(소재로 짐작한 색 포함) 괄호로 밝힌다
  const nt = (s, c) => !colorIn(s) && c && !s.includes(c[0]) ? `(${c[0]})` : '';
  // 겹쳐 입는 상의는 제일 넓게 보이는 옷의 색만 적어 목록을 짧게 둔다
  const tnotes = [];
  if (!colorIn(mainP)) tnotes.push(multi ? `${mainP.split(' ').pop()} ${topC[0]}` : topC[0]);
  const rows = [];
  rows.push(sel.outer
    ? {slot:'겉옷', name: on.base, note: O ? nt(outerP, outerC) : '', how: on.paren || HOW[sel.outer.f] || '', kw: sel.outer.kw, drawn: !!O}
    : {slot:'겉옷', name:'없이', note:'', how:'', kw:'', drawn:false});
  rows.push({slot:'상의', name: tn.base, note: tnotes.length ? `(${tnotes.join(' · ')})` : '', how: HOW[f] || '', kw: sel.top.kw, drawn:true});
  rows.push({slot:'하의', name: bn.base, note: nt(bn.base, bottomC), how: bk === 'jogger' ? '' : HOW[sel.bottom.f] || '', kw: sel.bottom.kw, drawn:true});
  rows.push({slot:'신발', name: sn.base, note: nt(shoeP, shoesC), how: sn.paren || (bk === 'shorts' ? '' : HOW[sel.shoes.f]) || '', kw: sel.shoes.kw, drawn:true});
  if (en) rows.push({slot:'소품', name: en.base, note: E.draw ? nt(en.base, extraC) : '', how: en.paren || EXH[ek] || '', kw: sel.extra.kw, drawn: E.draw});
  let n = 0; rows.forEach(r => { if (r.drawn) r.num = ++n; });
  return {O, Oin, P, B, S, E, rows};
}

async function search(){
  const q = $('#q').value.trim();

  if (!q) return;

    // 한글 지명은 '천안'보다 '천안시'로 등록된 경우가 많아서 시·광역시·특별시를 붙여 같이 찾는다
    const variants = [q];
    if (/[가-힣]$/.test(q) && !/(시|군|도)$/.test(q)) variants.push(q + '시', q + '광역시', q + '특별시');
    const all = await Promise.all(variants.map(v =>
      fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=10&language=ko&format=json`)
        .then(r => r.ok ? r.json() : {}).catch(() => ({}))));
    const seen = new Set(); let res = [];
    all.forEach(j => (j.results || []).forEach(x => { if (!seen.has(x.id)) { seen.add(x.id); res.push(x); } }));
    const krFirst = /[가-힣]/.test(q);
    res = res.filter(x => /^PPL/.test(x.feature_code || 'PPL'))
      .sort((a,b) => (krFirst ? (b.country_code === 'KR') - (a.country_code === 'KR') : 0) || (b.population||0) - (a.population||0))
      .slice(0,8);
    if (!res.length) { ul.innerHTML = '<li class="msg">결과가 없다. 가까운 시 이름이나 영어 이름(예: Cheonan)으로 찾아봐.</li>'; return; }

    ul.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      const x = res[+b.dataset.i];

/* ---------- 날씨 ---------- */
async function load(force){
  if (fetching) return;
  if (!force && wx && Date.now() - lastFetch < 30*60*1000) return;
  fetching = true;
  if (!wx) $('#cond').innerHTML = '<p class="msg">날씨 불러오는 중…</p>';
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${st.lat}&longitude=${st.lon}`
    + '&current=temperature_2m,apparent_temperature,weather_code'
    + '&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m,relative_humidity_2m'
    + '&daily=uv_index_max,sunrise,sunset&wind_speed_unit=ms&timezone=auto&forecast_days=3';
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    wx = await r.json();
    lastFetch = Date.now();
    render();
  } catch(e) {
    $('#where').textContent = '날씨 못 불러옴';
    $('#cond').innerHTML = `<p class="msg">날씨를 못 불러왔다 (${esc(e.message)}). <button class="plain" type="button" id="retry">다시 시도</button></p>`;
    $('#retry').addEventListener('click', () => load(true));
    $('#look').hidden = true; $('#outfit').hidden = true; closeSheet();
  } finally { fetching = false; }
}
setInterval(() => { if (document.visibilityState === 'visible') load(false); }, 60*1000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(false); });

/* ---------- 계산 ---------- */
const DOW = ['일','월','화','수','목','금','토'];
const r0 = x => Math.round(x);
const deg = x => `${r0(x)}°`;
function hashStr(s){ let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const dist = (i,t) => t < i.lo ? i.lo - t : t > i.hi ? t - i.hi : 0;
function pick(list, t, seed, filt, preferSeasonal, strict){
  let pool = filt ? list.filter(filt) : list.slice();
  let fit = pool.filter(i => t >= i.lo && t <= i.hi);
  if (!fit.length) {
    // 딱 맞는 게 없으면 4° 안쪽으로 벗어난 것만 빌려 온다. strict면 그것도 없을 때 비워서 대체 목록으로 넘긴다.
    const near = pool.slice().sort((a,b) => dist(a,t) - dist(b,t));
    fit = near.filter(i => dist(i,t) <= 4).slice(0,2);
    if (!fit.length && !strict) fit = near.slice(0,1);
  }
  if (!fit.length) return {main:null};
  // 소품: 머플러·장갑·볼캡처럼 그날 날씨에만 맞는 것을 사계절용(시계·가방)보다 먼저
  const seasonal = preferSeasonal ? fit.filter(i => i.hi - i.lo < 60) : [];
  const from = seasonal.length ? seasonal : fit;
  return {main: from[(seed + st.shuffle) % from.length]};
}

function analyse(){
  const H = wx.hourly, today = wx.current.time.slice(0,10);
  const dates = [...new Set(H.time.map(t => t.slice(0,10)))];
  const date = dates[dates.indexOf(today) + st.day] || today;
  const nowH = +wx.current.time.slice(11,13);
  let s = st.start, e = st.end;
  let fromNow = false;
  if (st.day === 0 && nowH > s) { s = nowH; fromNow = true; }
  if (s > e) return {date, past:true};
  const idx = [];
  H.time.forEach((t,i) => { if (t.slice(0,10) === date) { const h = +t.slice(11,13); if (h >= s && h <= e) idx.push(i); } });
  if (!idx.length) return {date, past:true};
  const g = k => idx.map(i => H[k][i]);
  const hours = idx.map(i => +H.time[i].slice(11,13));
  const feels = g('apparent_temperature'), temps = g('temperature_2m'), prob = g('precipitation_probability').map(x => x ?? 0),
        prec = g('precipitation').map(x => x ?? 0), codes = g('weather_code'), wind = g('wind_speed_10m'), hum = g('relative_humidity_2m');
  const iMin = feels.indexOf(Math.min(...feels)), iMax = feels.indexOf(Math.max(...feels));
  const pMax = Math.max(...prob), iP = prob.indexOf(pMax);
  const precSum = prec.reduce((a,b) => a+b, 0);
  const di = wx.daily.time.indexOf(date);
  const uv = di >= 0 ? wx.daily.uv_index_max[di] : null;
  const mins = t => t ? +t.slice(11,13) * 60 + +t.slice(14,16) : null;
  const sr = di >= 0 ? mins(wx.daily.sunrise[di]) : null, ss = di >= 0 ? mins(wx.daily.sunset[di]) : null;
  const worst = codes.reduce((a,c) => sev(c) > sev(a) ? c : a, codes[0]);
  const adj = st.sens;
  return {
    date, s, e, fromNow, hours, feels, temps, prob, prec, codes,
    night: h => sr != null && ss != null && (h * 60 < sr || h * 60 >= ss),
    tOuter: feels[iMin] + adj, hOuter: hours[iMin],
    tTop: feels[iMax] + adj, hTop: hours[iMax],
    tMid: feels.reduce((a,b) => a+b, 0) / feels.length + adj,
    tMinRaw: Math.min(...temps), tMaxRaw: Math.max(...temps),
    feelMinRaw: feels[iMin], feelMaxRaw: feels[iMax],
    diurnal: Math.max(...temps) - Math.min(...temps),
    pMax, hP: hours[iP], precSum,
    rainy: codes.some(isRainCode) || precSum >= 0.5 || pMax >= 60,
    maybeRain: pMax >= 30,
    snowy: codes.some(isSnowCode),
    hSnow: hours[Math.max(0, codes.findIndex(isSnowCode))],
    windMax: Math.max(...wind), humAvg: hum.reduce((a,b) => a+b, 0) / hum.length,
    uv, worst
  };
}

/* ---------- 그리기 ---------- */
function render(){
  if (!wx) return;
  const A = analyse();
  const d = new Date(A.date + 'T12:00:00');
  const dLabel = `${d.getMonth()+1}월 ${d.getDate()}일(${DOW[d.getDay()]})`;
  const upd = wx.current.time.slice(11,16);

  if (A.past) {
    $('#where').textContent = `${st.city} · ${dLabel}`;
    $('#cond').innerHTML = `<p class="msg">오늘 외출 시간(${st.start}~${st.end}시)이 이미 지났다. <button class="plain" type="button" id="toTmr">내일로 보기</button></p>`;
    $('#toTmr').addEventListener('click', () => { st.day = 1; save(); syncSeg('day', 1); render(); });
    $('#look').hidden = true; $('#outfit').hidden = true; closeSheet();
    return;
  }
  const win = A.fromNow ? `지금~${A.e}시` : `${A.s}~${A.e}시`;

  const lo = r0(A.feelMinRaw), hi = r0(A.feelMaxRaw);
  const hrs = A.hours.map((h,i) => `<div class="h"><span>${h}시</span>${icon(A.codes[i], A.night(h))}<b${h === A.hOuter ? ' class="lo"' : ''}>${deg(A.feels[i])}</b><i>${A.prob[i] ? A.prob[i] + '%' : ''}</i></div>`).join('');
  // 사진 위에는 날짜·날씨 한 줄만. 시간별 날씨는 사진 아래에서 펼쳐서 본다
  $('#where').innerHTML = `${esc(dLabel)} ${esc(st.city)} <em>체감 ${lo === hi ? lo + '°' : `${lo}°~${hi}°`}</em> <span class="s">${esc(WMO[A.worst] ?? '')}${A.pMax >= 30 ? ` · 강수 ${A.pMax}%` : ''}</span>`;
  const condTop = '';
  const wxMore = `<details class="hw"><summary>시간별 날씨 · ${esc(win)} · 강수 ${A.pMax}%</summary>
    <p class="sub">기온 ${deg(A.tMinRaw)}~${deg(A.tMaxRaw)} · 바람 ${A.windMax.toFixed(1)}m/s${st.sens ? ` · 체질 ${st.sens > 0 ? '+' : ''}${st.sens}° 반영` : ''} · ${upd} 기준</p>
    <div class="hrs" aria-label="시간별 체감온도와 강수확률">${hrs}</div></details>`;

  /* ----- 코디 고르기 ----- */
  const M = LEVELS[st.level];
  const seed = hashStr(A.date + st.level);
  let outer;
  const outerT = A.diurnal >= 10 && A.tOuter > -2 ? A.tOuter + 2 : A.tOuter;
  if (A.tOuter >= 24) outer = {main:null};
  else {
    const list = A.tOuter >= 20 ? M.outer.filter(i => i.hi >= 21) : M.outer;
    // 비·눈·센 바람엔 바람이 통하고 물을 먹는 니트 겉옷과 스웨이드를 뺀다
    const outerF = (A.rainy || A.snowy || A.windMax >= 8) ? (i => !i.r && i.f !== 'knit') : null;
    outer = pick(list, outerT, seed, outerF, false, !!outerF);
    if (!outer.main) outer = pick(list, outerT, seed);
  }
  const top = pick(M.top, A.tTop, seed + 1);
  const bottom = pick(M.bottom, A.tMid, seed + 2);
  // 눈 오는 날은 방수·보온 부츠, 비 오는 날은 고무 레인부츠. 단계와 상관없이 같은 신발
  const shoes = A.snowy ? {main: SNOW_SHOE} : A.rainy ? {main: RAIN_SHOE} : pick(M.shoes, A.tMid, seed + 3);
  const ex = pick(M.extra, A.tOuter, seed + 4, null, true);

  /* ----- 오늘 제일 중요한 것 ----- */
  const fo = deg(A.feelMinRaw), ft = deg(A.feelMaxRaw);
  const pts = [];
  if (A.snowy) pts.push(['눈', `${A.hSnow}시부터 · 고무 밑창 신발, 우산`]);
  else if (A.rainy) pts.push([A.pMax >= 70 || A.precSum >= 5 ? '장우산' : '우산', `${A.hP}시 강수 ${A.pMax}%${A.precSum >= 0.1 ? ` · ${A.precSum.toFixed(1)}mm` : ''} · 스웨이드·캔버스 신발은 피하기`]);
  else if (A.maybeRain) pts.push(['접이식 우산', `${A.hP}시 강수 ${A.pMax}%`]);
  if (A.tTop >= 31) pts.push(['더위', `${A.hTop}시 체감 ${ft} · 붙지 않는 핏, 물`]);
  if (A.tOuter <= -5) pts.push(['목·손 보온', `체감 ${fo} · 머플러, 장갑, 발열 내의`]);
  else if (A.tOuter <= 4) pts.push(['발열 내의', `체감 ${fo}까지 · 안에 한 겹`]);
  if (A.diurnal >= 10) pts.push([`일교차 ${r0(A.diurnal)}°`, `${deg(A.tMinRaw)}~${deg(A.tMaxRaw)} · 벗기 쉬운 겉옷`]);
  else if (A.diurnal >= 7) pts.push([`일교차 ${r0(A.diurnal)}°`, '겉옷을 벗어도 괜찮은 상의']);
  if (A.windMax >= 8) pts.push(['바람', `초속 ${A.windMax.toFixed(1)}m · 나일론·가죽 겉옷`]);
  if (A.uv != null && A.uv >= 6) pts.push(['자외선', `지수 ${A.uv.toFixed(0)} · 모자, 선크림`]);
  if (A.tTop >= 28 && A.humAvg >= 70) pts.push(['습도', `${r0(A.humAvg)}% · 린넨·시어서커`]);
  if (A.tTop >= 28) pts.push(['실내 냉방', '얇은 셔츠 하나 가방에']);
  const key = M.key;
  const first = pts.length ? pts[0] : key;
  // 제일 중요한 것은 한 줄만 남긴다
  $('#cond').innerHTML = condTop + `<p class="key1"><b>${esc(first[0])}</b>${esc(first[1])}</p>` + wxMore;

  /* ----- 착장 그림 + 목록 ----- */
  const pal = M.pal[(seed + st.shuffle) % M.pal.length];
  const sel = {outer: outer.main, top: top.main, bottom: bottom.main, shoes: shoes.main, extra: ex.main};
  const R = resolve(sel, pal, M.mood);
  const bySlot = {'겉옷': sel.outer, '상의': sel.top, '하의': sel.bottom, '신발': sel.shoes, '소품': sel.extra};
  // 위에는 고른 제품의 무신사 상품 사진을 번호와 함께 모아 보여 주고, 아래 목록은 같은 번호로 설명한다
  const tiles = [];
  let num = 0;
  const rows = R.rows.map(r => {
    const it = bySlot[r.slot];
    // 제품 줄 → 입는 법 → 접힌 칸(대체·못 살 때) 순서. 겹쳐 입는 상의는 제품 두 개
    const specs = it && it.sp ? [it.sp].concat(it.sp2 ? [it.sp2] : []) : [];
    const full = it && it.sp2 ? it.n.split(/\s*\+\s*/) : [];
    const ps = specs.map((s, j) => prodHTML(s, full[j] ? full[j].split(' ').pop() : '')).filter(Boolean);
    const n = ps.length ? ++num : 0;
    specs.forEach((s, j) => { const m = PBY[s] && PBY[s].main; if (m) tiles.push({n, m, cap: full[j] || r.name, big: r.slot === '겉옷'}); });
    return `<li><span class="n${n ? '' : ' x'}">${n || ''}</span><div><span class="sl">${r.slot}${r.name !== '없이' ? ' · ' + esc(r.name) : ' 없이'}</span>`
      + ps.map(p => p.h).join('') + (r.how ? `<span class="how">${esc(r.how)}</span>` : '') + ps.map(p => p.d).join('')
      + `</div></li>`;
  }).join('');
  const board = `<div class="board" role="list" aria-label="오늘 코디 제품 사진">` + tiles.map(t => `<figure class="tile${t.big ? ' lead' : ''}" role="listitem">`
    + `<div class="ph">${photo(t.m, t.big ? 640 : 320, '')}<span class="n">${t.n}</span></div><figcaption>${esc(t.cap)}</figcaption></figure>`).join('') + '</div>'
    + `<p class="src">사진은 제품마다 무신사 상품 페이지 대표 사진이라 모델이 다름</p>`;
  // 넣어 둔 제품이 겨울용이라, 그보다 따뜻한 날엔 그렇다고 적는다
  const topHi = Math.max(...M.top.map(i => i.hi));
  const warm = A.tTop > topHi + 2 ? `<p class="note">넣어 둔 제품은 겨울용이라 오늘 낮 체감 ${ft}엔 두꺼울 수 있음</p>` : '';
  const dates = [...new Set(PRODUCTS.map(p => p.checked))];
  const dTxt = dates.length === 1 ? `${+dates[0].slice(5, 7)}월 ${+dates[0].slice(8, 10)}일` : '제품마다 다른 날짜에 확인한';
  const needBody = (!st.bh || !st.bw || !st.bf) ? ` · <button class="plain" type="button" id="toSet" style="padding:1px 7px;font-size:12px">키·몸무게·발 넣기</button> 넣으면 내 사이즈가 나옴` : '';
  const recs = `<p class="note">가격은 ${dTxt} 무신사 판매가(쿠폰·적립 전)${needBody}</p>${warm}
    ${board}<ol class="items">${rows}</ol>
    <div class="acts"><button class="plain" type="button" id="shuf">다른 조합</button></div>`;

  /* ----- 착용샷 ----- */
  // 같은 단계의 착용샷을 전부 옆으로 넘겨 보게 한다. 오늘 체감(겉옷 기준)이 사진 온도 범위에서 2° 안쪽인 것부터,
  // 그다음은 범위에서 가까운 순서로 '참고 코디'. 바지 실측·핏을 넣었으면 같은 날씨 묶음 안에서 비교할 수 있는 것부터
  curA = A;
  curOrder = orderLooks(A);
  if (st.lookN >= curOrder.length) st.lookN = 0;
  const prevKey = sheetKey, prevI = sheetI;
  // 30분마다 날씨를 다시 받아도 사진 순서가 같으면 사진은 그대로 두고 아래 설명만 바꾼다(사진이 깜빡이지 않게)
  const sig = curOrder.map(o => o.L.key + (o.dd > 2 ? '*' : '')).join(',');
  const old = $('#car');
  if (curOrder.length) {
    if (!(old && old.dataset.sig === sig)) {
      $('#look').innerHTML = `<div class="car" id="car" data-sig="${esc(sig)}" aria-label="코디 사진. 옆으로 밀면 다음 코디">`
        + curOrder.map((o, n) => slideHTML(o, n)).join('') + `</div><div id="below"></div>`;
      bindLook();
    }
    $('#look').classList.toggle('show', st.show);
    $('#outfit').innerHTML = `<details class="recs"><summary>사진 없이 날씨로 고른 제품 추천 보기</summary>${recs}</details>`;
  } else {
    $('#look').innerHTML = `<p class="nolook">이 단계에 등록된 착용샷이 없어.</p>`;
    $('#outfit').innerHTML = `<p class="k" style="margin-bottom:8px">날씨로 고른 제품 추천 (착용샷 아님)</p>` + recs;
  }
  $('#look').hidden = false;
  const car = $('#car');
  if (car && Math.round(car.scrollLeft / Math.max(1, car.clientWidth)) !== st.lookN) car.scrollLeft = st.lookN * car.clientWidth;
  drawBelow();
  if (prevI != null && curLook && curLook.key === prevKey && curLook.spots[prevI]) openSheet(prevI, true); else closeSheet();
  $('#outfit').hidden = false;
  // 사진이 안 뜨면 깨진 아이콘 대신 글자로 알린다
  $('#outfit').querySelectorAll('img[data-ph]').forEach(im => im.addEventListener('error', () => {
    const s = document.createElement('span'); s.className = 'noimg'; s.textContent = '사진 못 불러옴'; im.replaceWith(s);
  }, {once: true}));
  $('#shuf').addEventListener('click', () => { st.shuffle++; render(); });
  const ts = $('#toSet');
  if (ts) ts.addEventListener('click', () => { $('#set').hidden = false; $('#setBtn').setAttribute('aria-expanded', 'true'); $('#bh').focus(); window.scrollTo(0, 0); });
}

/* ---------- 제품·사이즈 ---------- */
const PBY = {};
PRODUCTS.forEach(p => { (PBY[p.spec] = PBY[p.spec] || {})[p.role] = p; });
const won = n => Number(n).toLocaleString('ko-KR') + '원';
const purl = id => `https://www.musinsa.com/products/${encodeURIComponent(id)}`;
const lnk = (p, t) => `<a href="${purl(p.id)}" target="_blank" rel="noopener noreferrer">${t}</a>`;
// 사진은 무신사 이미지 서버에서 바로 불러온다(저장소에 안 올림). 상품 페이지에 고른 색만 찍힌 사진이 없으면 빈칸에 그렇게 적는다
const IMG = 'https://image.msscdn.net/images/';
function photo(p, w, lazy){
  if (!p.img || p.img.indexOf(IMG) !== 0) return `<span class="noimg">이 색 사진 없음</span>`;
  const src = 'https://image.msscdn.net/thumbnails/images/' + p.img.slice(IMG.length) + '?w=' + w;
  return `<img data-ph src="${esc(src)}" alt="${esc(shortName(p.name))}" referrerpolicy="no-referrer"${lazy ? ' loading="lazy"' : ''} decoding="async">`;
}
// '무신사 스탠다드(MUSINSA STANDARD) …'처럼 한글 브랜드 뒤에 붙은 영문 브랜드만 뺀다. '(BLACK)' 같은 색은 남긴다
const shortName = n => n.replace(/^([가-힣]+(?: [가-힣]+)?)\(([A-Z][A-Z0-9 &.'\-]*)\)\s*/, (m, k, e) => /BLACK|WHITE|GR[AE]Y|NAVY|BROWN|BEIGE|IVORY|CHARCOAL|KHAKI|CREAM/.test(e) ? m : k + ' ');

// 옷: 후기에 적힌 키·몸무게·산 사이즈·사이즈 평가로, 내 키·몸무게와 가까운 후기를 골라 계산한다
function clothSize(p){
  const S = p.sizes || [];
  if (p.glove) return {t:'손 크기로 고르기', why:'장갑은 손 크기 기준이라 키·몸무게로 계산 안 함. 사이즈 ' + S.join(' · ')};
  if (S.length <= 1) return {t: S[0] || '', k: S.length ? 0 : null, why: ''};
  if (p.pick) return {t: p.pick, why: '보이는 후기에서 산 옵션이 ' + p.pick + ' 위주'};
  if (!st.bh || !st.bw) return {t:'', why:''};
  // 'Short ver. 50'처럼 앞에 기장 옵션이 붙은 후기는 뒤의 사이즈로 본다
  const si = s => { const i = S.indexOf(s); return i >= 0 ? i : S.indexOf(s.split(' ').pop()); };
  const rv = (p.rv || '').split(';').filter(Boolean).map(x => { const [h, w, s, f] = x.split(','); return {h:+h, w:+w, s, f: isFinite(+f) ? +f : 0, i: si(s)}; }).filter(r => r.i >= 0);
  rv.forEach(r => { r.d = Math.hypot((r.h - st.bh) / 4, (r.w - st.bw) / 5); });
  rv.sort((a, b) => a.d - b.d);
  let use = rv.filter(r => r.d <= 1.5).slice(0, 5), loose = false;
  if (!use.length) { use = rv.filter(r => r.d <= 3).slice(0, 3); loose = true; }
  if (!use.length) return {t:'실측표로 고르기', why:'키·몸무게가 가까운 후기가 없음'};
  // '조금 큼'이면 0.4치수 작게, '조금 작음'이면 0.4치수 크게 본다(후기 하나로 한 치수를 바꾸지 않게)
  let sw = 0, sx = 0;
  use.forEach(r => { const wt = 1 / (0.4 + r.d); sw += wt; sx += wt * (r.i - 0.4 * r.f); });
  const k = Math.min(S.length - 1, Math.max(0, Math.round(sx / sw)));
  const fw = f => f > 0 ? ' 큼' : f < 0 ? ' 작음' : '';
  return {t: S[k], k, why: `키·몸무게 가까운 후기 ${use.length}개: ` + use.map(r => `${r.h}cm ${r.w}kg ${r.s}${fw(r.f)}`).join(', ') + (loose ? ' (체형 차이가 좀 있어 참고만)' : '')};
}
// 신발: 발 길이와 같은 옵션, 없으면 후기에 '큼'이 많을 때 작은 쪽
function shoeSize(p){
  if (!st.bf) return {t:'', why:''};
  const opts = (p.stock || '').split(' ').filter(Boolean).map(x => ({mm: parseInt(x, 10), out: /x$/.test(x)})).sort((a, b) => a.mm - b.mm);
  if (!opts.length) return {t:'', why:''};
  const rv = (p.rvShoe || '').split(';').filter(Boolean).map(x => { const [mm, fit, ball] = x.split(','); return {mm:+mm, fit, ball}; });
  const n = rv.length, big = rv.filter(r => /큼/.test(r.fit)).length, small = rv.filter(r => /작음/.test(r.fit)).length;
  const F = st.bf, why = [];
  let o = opts.find(x => x.mm === F);
  if (!o) {
    const lower = opts.filter(x => x.mm < F).pop(), upper = opts.find(x => x.mm > F);
    o = lower && (!upper || (n && big * 2 >= n)) ? lower : upper;
    why.push(`${F}mm 옵션이 없어서 ${o.mm}`);
  }
  if (n) why.push(`보이는 후기 ${n}개 중 '큼' ${big} · '작음' ${small}`);
  if (n && big * 2 >= n && opts.some(x => x.mm === o.mm - 5 && !x.out)) why.push(`${o.mm - 5}도 고려`);
  const wide = rv.filter(r => /넓음/.test(r.ball)).length, narrow = rv.filter(r => /좁음/.test(r.ball)).length;
  if (n) why.push(`발볼 '넓음' ${wide} · '좁음' ${narrow}`);
  return {t: String(o.mm), out: o.out, why: why.join(' · ')};
}
const sizeOf = p => p.shoe ? shoeSize(p) : clothSize(p);
function chartLine(p, z){
  const c = p.chart;
  if (!c || !c.rows || z.k == null) return '';
  const S = p.sizes || [];
  const ri = p.rowNames ? p.rowNames.indexOf(S[z.k]) : c.rows.length === S.length ? z.k : -1;
  if (ri < 0 || !c.rows[ri]) return '';
  return `${esc(z.t)} 실측: ` + c.cols.map((h, j) => `${esc(h)} ${c.rows[ri][j]}`).join(' · ') + 'cm';
}
function optTxt(p){
  const a = [];
  const low = p.name.toLowerCase();
  if (p.color && !low.includes(String(p.color).toLowerCase())) a.push(p.color);
  if (p.option) a.push('옵션 ' + p.option);
  return a.join(' · ');
}
function sizeTxt(z){
  if (!z.t) return '';
  return `<span class="sz">${esc(z.t)}</span>${z.out ? ' <span class="warn">(품절)</span>' : ''}`;
}
function prodHTML(spec, label){
  const g = PBY[spec];
  if (!g || !g.main) return '';
  const m = g.main, a = g.alt, zm = sizeOf(m), za = a ? sizeOf(a) : null;
  const meta = (p, z) => [optTxt(p) && esc(optTxt(p)), sizeTxt(z), won(p.price)].filter(Boolean).join(' · ');
  let s = `<span class="pd">${label ? `<span class="cn">${esc(label)}</span> ` : ''}<b>${esc(shortName(m.name))}</b><br>${meta(m, zm)} ${lnk(m, '무신사 ↗')}`
    + (m.priceNote ? `<br><span class="cn">${esc(m.priceNote)}</span>` : '')
    + (m.warn ? `<br><span class="warn">${esc(m.warn)}</span>` : '') + '</span>';
  const fb = FB[spec];
  const why = [zm.why, chartLine(m, zm)].filter(Boolean);
  const facts = [m.fitPct, m.reviewCount ? `후기 ${Number(m.reviewCount).toLocaleString('ko-KR')}개` : '', m.sold ? `누적판매 ${m.sold}` : ''].filter(Boolean).join(' · ');
  const d = `<details class="more2"><summary>${label ? esc(label) + ' ' : ''}대체 상품 · 못 살 때</summary>`
    + (a ? `<p class="altp"><span class="ai">${photo(a, 160, 1)}</span><span><span class="lbl">대체</span>${esc(shortName(a.name))} · ${meta(a, za)} ${lnk(a, '↗')}`
      + (a.priceNote ? `<br><span class="cn">${esc(a.priceNote)}</span>` : '')
      + (a.warn ? `<br><span class="warn">${esc(a.warn)}</span>` : '')
      + `<br><span class="cn">소재 ${esc(a.mat)}${a.claim ? ' · ' + esc(a.claim) : ''}${a.optNote ? ' · ' + esc(a.optNote) : ''}</span>`
      + (za && za.why ? `<br><span class="cn">${esc(za.why)}</span>` : '') + '</span></p>' : '')
    + (fb ? `<p><span class="lbl">못 사면</span>핏: ${esc(fb[0])}<br>소재: ${esc(fb[1])}<br>느낌: ${esc(fb[2])}</p>` : '')
    + `<p><span class="lbl">대표 소재</span>${esc(m.mat)}${m.claim ? '<br>' + esc(m.claim) : ''}${m.optNote ? '<br>' + esc(m.optNote) : ''}</p>`
    + (why.length ? `<p><span class="lbl">사이즈</span>${why.map(esc).join('<br>')}</p>` : '')
    + (facts ? `<p><span class="lbl">제품</span>${esc(facts)}</p>` : '')
    + '</details>';
  return {h: s, d};
}

/* ---------- 착용샷 + 아래 카드 ---------- */
const PID = {};
PRODUCTS.forEach(p => { if (!PID[p.id]) PID[p.id] = p; });
let curLook = null, curOrder = [], curA = null, sheetI = null, sheetKey = null, lastFocus = null, quietUntil = 0;
const md = d => `${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일`;
const THUMB = (path, w) => 'https://image.msscdn.net/thumbnails/images/' + path + '?w=' + w;
const AR = 0.56;          // 사진 칸 가로:세로. 어깨~신발이 폰 화면 높이에 맞게 들어가는 비율
const LIMIT = 100000;     // 10만원. 신발·데님·가방·시계처럼 사계절 쓰는 것 말고는 이 아래로
const FITS = {straight:'스트레이트', wide:'와이드', tapered:'테이퍼드', balloon:'벌룬', flare:'플레어'};
// 바지 핏은 무신사 상품명에 적힌 말로만 나눈다. 이름에 없으면 모른다고 적는다
const fitOf = p => /플레어/.test(p.name) ? 'flare' : /테이퍼드/.test(p.name) ? 'tapered' : /벌룬/.test(p.name) ? 'balloon' : /와이드/.test(p.name) ? 'wide' : /스트레이트/.test(p.name) ? 'straight' : '';
const fitTxt = p => { const f = fitOf(p); return (f ? FITS[f] : '이름에 핏 표기 없음') + (/밴딩/.test(p.name) ? ' · 밴딩' : ''); };
const pantsOf = L => { const s = L.spots.find(x => x.pants); return s && PID[s.id]; };
const over = p => p.price > LIMIT;
const sgn = d => { const v = +d.toFixed(2); return v === 0 ? '같음' : (v > 0 ? '+' : '−') + Math.abs(v) + 'cm'; };
const pct = v => (v * 100).toFixed(2) + '%';
function sizeLine(p){
  const z = sizeOf(p);
  const needs = p.shoe ? !st.bf : (!st.bh || !st.bw);
  if (z.t && z.t !== '실측표로 고르기') return `<span class="sz">${esc(z.t)}</span>` + ((z.out || (p.out && p.out.includes(z.t))) ? ' <span class="warn">(이 사이즈 품절)</span>' : '');
  if (needs) return `<button class="plain" type="button" data-toset="${p.shoe ? 'bf' : 'bh'}" style="padding:1px 7px;font-size:12px">${p.shoe ? '발 길이' : '키·몸무게'} 넣으면 계산</button>`;
  return '실측 확인';
}

// 바지 추천 사이즈: 허리단면을 넣었으면 실측 허리단면이 가장 가까운 사이즈, 아니면 키·몸무게가 비슷한 후기로 고른 사이즈
function pantsPick(p){
  const c = p.chart, S = p.sizes || [];
  if (!c || !c.rows || c.rows.length !== S.length) return null;
  const iL = c.cols.indexOf('총장'), iW = c.cols.indexOf('허리단면');
  let k = null, basis = '';
  if (st.pw && iW >= 0) {
    let best = Infinity;
    c.rows.forEach((r, i) => { if (r[iW] == null) return; const d = Math.abs(r[iW] - st.pw); if (d < best - 1e-9) { best = d; k = i; } });
    if (k != null) basis = '허리단면이 가장 가까운 사이즈';
  }
  if (k == null && S.length > 1) {
    const z = clothSize(p);
    if (z.k != null && z.t && S[z.k] === z.t) { k = z.k; basis = '키·몸무게 비슷한 후기로 고른 사이즈'; }
  }
  return {k, basis, iL, iW, S, rows: c.rows, row: k != null ? c.rows[k] : null};
}
// 코디 순서용: 사진 속 바지 실측을 내 바지와 비교할 수 있는지, 얼마나 가까운지, 좋아하는 핏인지
function fitScore(L){
  const p = pantsOf(L), r = {cmp: false, pf: false, d: 0};
  if (!p) return r;
  r.pf = !!st.pf && fitOf(p) === st.pf;
  const q = (st.pl || st.pw) ? pantsPick(p) : null;
  if (!q) return r;
  if (st.pl && q.iL >= 0) { r.d += q.row ? Math.abs(q.row[q.iL] - st.pl) : Math.min(...q.rows.map(x => Math.abs(x[q.iL] - st.pl))); r.cmp = true; }
  if (st.pw && q.iW >= 0 && q.row) { r.d += Math.abs(q.row[q.iW] - st.pw); r.cmp = true; }
  return r;
}
function orderLooks(A){
  const use = !!(st.pf || st.pl || st.pw);
  const all = LOOKS.filter(L => L.level === st.level).map((L, i) => ({L, i, dd: dist(L, A.tOuter), f: fitScore(L)}));
  const grp = o => o.dd <= 2 ? 0 : 1;
  all.sort((a, b) => grp(a) - grp(b) || (grp(a) ? a.dd - b.dd : 0)
    || (use ? (b.f.pf - a.f.pf) || (b.f.cmp - a.f.cmp) || (a.f.cmp && b.f.cmp ? a.f.d - b.f.d : 0) : 0)
    || a.i - b.i);
  return all;
}

// 사진을 어깨~신발 칸으로 잘라 보여 준다(사진 파일은 그대로, 화면에서 위치만 옮김)
function crop(L){
  const r = (L.h || 1800) / (L.w || 1500), H = 1 - L.y0, W = AR * H * r;
  const x0 = Math.min(Math.max(0, L.cx - W / 2), 1 - W);
  return {x0, y0: L.y0, W, H};
}
function slideHTML(o, n){
  const L = o.L, c = crop(L);
  const srcset = [640, 1000].map(w => THUMB(L.img, w) + ' ' + w + 'w').join(', ') + ', ' + IMG + L.img + ' ' + (L.w || 1500) + 'w';
  // 점은 '착용 제품 보기'를 켰을 때만 보인다(CSS). 이 컷에서 안 보이는 옷은 점 없이 목록에만
  const dots = L.spots.map((s, i) => s.x == null ? '' : `<button type="button" class="dot" data-i="${i}" aria-pressed="false" aria-label="${esc(s.label)} 제품 보기" style="left:${pct((s.x - c.x0) / c.W)};top:${pct((s.y - c.y0) / c.H)}"></button>`).join('');
  return `<div class="slide" data-n="${n}"><div class="lk">`
    + `<img src="${esc(THUMB(L.img, 1000))}" srcset="${esc(srcset)}" sizes="(max-width:640px) 160vw, 760px" alt="코디 사진: ${esc(L.spots.map(s => s.label).join(', '))}" referrerpolicy="no-referrer" decoding="async"${n > 1 ? ' loading="lazy"' : ''} style="width:${pct(1 / c.W)};left:${pct(-c.x0 / c.W)};top:${pct(-c.y0 / c.H)}">`
    + (o.dd > 2 ? '<span class="ref">참고 코디</span>' : '') + dots + `</div></div>`;
}
const badges = p => (p.soldAll ? '<span class="badge">품절</span>' : '') + (over(p) ? '<span class="badge g">10만원 넘음</span>' : '');
function itemsHTML(L){
  return `<ul class="lki" aria-label="사진 속 제품">` + L.spots.map((s, i) => {
    const p = PID[s.id];
    if (!p) return '';
    return `<li><button type="button" data-i="${i}"><span class="ai">${photo(p, 120, 1)}</span>`
      + `<span class="lt"><b>${esc(s.label)} · ${esc(shortName(p.name))}</b><span>${won(p.price)}${badges(p)}${s.x == null ? ' · 이 사진에선 안 보임' : ''}</span></span>`
      + `<span class="go">보기</span></button></li>`;
  }).join('') + '</ul>';
}
function drawBelow(){
  const box = $('#below');
  if (!box) return;
  const o = curOrder[st.lookN];
  if (!o) { box.innerHTML = ''; return; }
  const L = o.L, A = curA, N = curOrder.length;
  curLook = L;
  // 오늘 날씨에 맞는 사진이 아니면, 가장 가까운 사진을 '참고 코디'로 두고 오늘 바꿀 것 한 줄
  const ref = o.dd > 2 ? `<p class="reft"><b>참고 코디</b>체감 ${L.lo}°~${L.hi}°용 사진이야. 오늘 체감 ${deg(A.tOuter)}엔 ${esc(A.tOuter < L.lo ? TIP[L.tip].cold : TIP[L.tip].warm)}</p>` : '';
  let sortn = '';
  if (st.pl || st.pw || st.pf) {
    const parts = [st.pl ? `총장 ${st.pl}cm` : '', st.pw ? `허리단면 ${st.pw}cm` : '', st.pf ? `${FITS[st.pf]} 핏` : ''].filter(Boolean).join(' · ');
    const any = curOrder.some(x => x.f.cmp || x.f.pf);
    sortn = `<p class="sortn">${any ? `넣어 둔 바지(${esc(parts)})와 비교할 수 있는 코디부터 보여 줌` : `넣어 둔 바지(${esc(parts)})와 비교할 실측·핏이 이 단계 사진엔 없어서 기본 순서`}`
      + (st.pf && any && !curOrder.some(x => x.f.pf) ? ` · ${esc(FITS[st.pf])} 바지 코디는 이 단계에 없음` : '') + '</p>';
  }
  // 비·눈: 사진 속 신발은 그대로 두고 바꿔 신을 신발을 따로 보여 준다
  const wet = A.snowy ? ['눈', PBY['S.snow'] && PBY['S.snow'].main] : A.rainy ? ['비', PBY['S.rain'] && PBY['S.rain'].main] : null;
  const alt1 = wet && wet[1] ? `<div class="alt1"><p class="k">오늘 ${wet[0]} 때문에 바꿔 신을 신발 · 사진 속 신발 아님</p><div class="altc"><span class="ai">${photo(wet[1], 160, 1)}</span>`
    + `<span class="tx"><b>${esc(shortName(wet[1].name))}</b><br>${sizeLine(wet[1])} · ${won(wet[1].price)} <span class="cn">${md(wet[1].checked)} 확인</span> · ${lnk(wet[1], '무신사 ↗')}</span></div></div>` : '';
  const src = `<details class="lkm"><summary>모델·사진 출처</summary><p>${L.model ? '사진에 적힌 모델 정보: ' + esc(L.model) : '이 사진엔 모델 키·몸무게가 안 적혀 있음'}</p>`
    + `<p>${esc(SRC[L.cut ? 1 : 0])} · ${lnk({id: L.page}, '사진이 실린 상품 페이지 ↗')}</p></details>`;
  box.innerHTML = `<div class="lkbar"><span class="cnt">${st.lookN + 1} / ${N}</span>`
    + `<button class="plain" type="button" id="showBtn" aria-pressed="${st.show}">착용 제품 보기</button>`
    + (N > 1 ? `<button class="plain" type="button" id="nextLook">다음 코디 ›</button>` : '') + `</div>`
    + ref + sortn + (st.show ? itemsHTML(L) : '') + alt1 + src;
  $('#showBtn').addEventListener('click', () => {
    st.show = !st.show;
    $('#look').classList.toggle('show', st.show);
    if (!st.show) closeSheet();
    drawBelow();
  });
  const nl = $('#nextLook');
  if (nl) nl.addEventListener('click', () => { const car = $('#car'); car.scrollTo({left: ((st.lookN + 1) % N) * car.clientWidth, behavior: 'smooth'}); });
  box.querySelectorAll('ul.lki button[data-i]').forEach(b => b.addEventListener('click', () => { lastFocus = b; openSheet(+b.dataset.i); }));
  imgFail(box);
  box.querySelectorAll('[data-toset]').forEach(b => b.addEventListener('click', () => toSet(b.dataset.toset)));
}

function cmpHTML(p, q){
  if (!q) return '';
  const ls = [];
  if (q.row) {
    const z = esc(q.S[q.k]);
    if (st.pl && q.iL >= 0) ls.push(`내가 잘 입는 바지 총장 <b>${st.pl}cm</b> / 사진 속 제품 추천 사이즈(${z}) 총장 <b>${q.row[q.iL]}cm</b> <span class="d">${sgn(q.row[q.iL] - st.pl)}</span>`);
    if (st.pw && q.iW >= 0) ls.push(`내가 잘 입는 바지 허리단면 <b>${st.pw}cm</b> / ${z} 허리단면 <b>${q.row[q.iW]}cm</b> <span class="d">${sgn(q.row[q.iW] - st.pw)}</span>`);
  } else if (st.pl && q.iL >= 0) {
    const v = q.rows.map(r => r[q.iL]).filter(x => x != null);
    ls.push(`내가 잘 입는 바지 총장 <b>${st.pl}cm</b> / 이 제품 총장 ${Math.min(...v)}~${Math.max(...v)}cm <span class="d">(사이즈마다 다름. 허리단면이나 키·몸무게를 넣으면 사이즈를 골라 비교)</span>`);
  }
  if (!st.pl && !st.pw) ls.push(`<span class="d">잘 맞는 바지의 총장·허리단면을 넣으면 이 바지 실측과 비교해 줌</span> <button class="plain" type="button" data-toset="pl" style="padding:1px 7px;font-size:12px">바지 실측 넣기</button>`);
  return `<div class="cmp">${ls.join('<br>')}</div>`;
}
// 다른 코디 사진에 나온 바지 중 지금 살 수 있는 것과 실측 비교
function pantsTable(p){
  const ids = [...new Set(LOOKS.flatMap(L => L.spots.filter(s => s.pants).map(s => s.id)))].filter(id => id !== p.id);
  const fp = fitOf(p), mine = !!(st.pl || st.pw);
  const sc = x => { if (!mine) return 0; const q = pantsPick(x); if (!q) return 999; let d = 0;
    if (st.pl && q.iL >= 0) d += q.row ? Math.abs(q.row[q.iL] - st.pl) : 50; if (st.pw && q.iW >= 0 && q.row) d += Math.abs(q.row[q.iW] - st.pw); return d; };
  const list = ids.map(id => PID[id]).filter(x => x && !x.soldAll)
    .sort((a, b) => (st.pf ? (fitOf(b) === st.pf) - (fitOf(a) === st.pf) : 0) || sc(a) - sc(b) || (fitOf(b) === fp) - (fitOf(a) === fp) || a.price - b.price)
    .slice(0, 3);
  const cell = x => { const q = pantsPick(x); if (!q) return '실측표 없음';
    if (q.row) return `${esc(q.S[q.k])}<br>총장 ${q.row[q.iL]} · 허리 ${q.row[q.iW]}` + (x.out && x.out.includes(q.S[q.k]) ? ' <span class="warn">품절</span>' : '');
    const v = q.rows.map(r => r[q.iL]); return `총장 ${Math.min(...v)}~${Math.max(...v)}`; };
  const row = (x, me) => `<tr><td>${me ? '<b>사진 속</b> ' : '<span class="nottag">사진 속 제품 아님</span>'}${esc(shortName(x.name).replace(/^무신사 스탠다드 /, ''))}<br><span class="cn">${esc(fitTxt(x))}</span></td>`
    + `<td>${cell(x)}</td><td class="pr">${won(x.price)}${me ? '' : '<br>' + lnk(x, '무신사 ↗')}</td></tr>`;
  return `<details${mine ? ' open' : ''}><summary>비슷한 바지 ${list.length}개와 실측 비교</summary>`
    + `<table class="pc"><tr><th>바지</th><th>${st.pw || (st.bh && st.bw) ? '추천 사이즈·실측' : '실측(cm)'}</th><th>가격</th></tr>${row(p, 1)}${list.map(x => row(x, 0)).join('')}</table>`
    + `<p class="cn" style="margin:4px 0 0">다른 코디 사진에 나온 바지. ${md(p.checked)} 기준 품절 아닌 것만</p></details>`;
}
function altHTML(L, a){
  return `<div class="altc"><span class="ai">${photo(a, 160, 1)}</span><span class="tx"><span class="nottag">사진 속 제품 아님</span><b>${esc(shortName(a.name))}</b>`
    + ((L.altWhy && L.altWhy[a.id]) ? '<br>' + esc(L.altWhy[a.id]) : '')
    + `<br>${sizeLine(a)} · ${won(a.price)} <span class="cn">${md(a.checked)} 확인</span>${a.stockNote ? ' · ' + esc(a.stockNote) : ''} · ${lnk(a, '무신사 ↗')}</span></div>`;
}
function cardHTML(L, i){
  const s = L.spots[i];
  const where = s.x == null ? `같은 촬영 다른 컷에 태그된 ${esc(s.label)} · 이 사진에선 안 보임`
    : `사진 속 ${esc(s.label)} · ${L.cut ? '같은 촬영 다른 컷에 무신사가 태그한 제품' : '무신사가 이 사진에 태그한 제품'}`;
  const head = `<div class="shh"><p class="k" id="shT">${where}</p><button type="button" id="shX">닫기</button></div>`;
  const p = PID[s.id];
  if (!p) return head + '<p>제품 정보를 못 찾았어.</p>';
  const isP = !!s.pants, q = isP ? pantsPick(p) : null;
  const z = sizeOf(p), zz = q && q.row ? {t: q.S[q.k], k: q.k} : z;
  const color = (p.name.match(/\[([^\]]+)\]\s*$/) || [])[1];
  const alts = ((L.alts && L.alts[s.id]) || []).map(id => PID[id]).filter(Boolean);
  const fb0 = L.fb && L.fb[s.id], fb = typeof fb0 === 'string' ? FB[fb0] : fb0;
  const sz = p.soldAll ? '<span class="warn">품절이라 계산 안 함</span>'
    : q && q.row ? `<span class="sz">${esc(q.S[q.k])}</span>${p.out && p.out.includes(q.S[q.k]) ? ' <span class="warn">(이 사이즈 품절)</span>' : ''} <span class="cn">${esc(q.basis)}</span>`
    : sizeLine(p);
  const why = [z.why, chartLine(p, zz)].filter(Boolean);
  const facts = [p.fitPct, p.reviewCount ? '후기 ' + Number(p.reviewCount).toLocaleString('ko-KR') + '개' : ''].filter(Boolean).join(' · ');
  let h = head
    + `<div class="cardm"><span class="ai">${photo(p, 240, '')}</span><span class="tx"><b class="nm">${esc(shortName(p.name))}</b>${badges(p)}`
    + (color ? `<span class="ln"><span class="lbl">색상</span>${esc(color)}</span>` : '')
    + (isP ? `<span class="ln"><span class="lbl">핏</span>${esc(fitTxt(p))}</span>` : '')
    + `<span class="ln"><span class="lbl">추천 사이즈</span>${sz}</span>`
    + `<span class="ln"><span class="lbl">판매가</span><b>${won(p.price)}</b> <span class="cn">${md(p.checked)} 확인${p.priceNote ? ' · ' + esc(p.priceNote) : ''}</span></span>`
    + (p.stockNote ? `<span class="ln"><span class="lbl">재고</span>${p.soldAll ? `<span class="warn">${esc(p.stockNote)}</span>` : esc(p.stockNote)} <span class="cn">${md(p.checked)} 확인</span></span>` : '')
    + `<a class="buy" href="${purl(p.id)}" target="_blank" rel="noopener noreferrer">${p.soldAll ? '무신사에서 재입고 확인 ↗' : '무신사 구매 페이지 ↗'}</a></span></div>`
    + (isP ? cmpHTML(p, q) : '');
  // 품절·10만원 넘음이면 살 수 있는 대체를 펼쳐 두고, 사진 속 제품과 섞이지 않게 따로 표시
  if (alts.length) {
    const t = p.soldAll ? '지금 살 수 있는 대체' : over(p) ? '10만원 아래 대체' : '비슷한 제품';
    const inner = alts.map(a => altHTML(L, a)).join('');
    h += (p.soldAll || over(p)) ? `<div class="altbox"><p class="k">${t} · 사진 속 제품 아님</p>${inner}</div>` : `<details><summary>${t} ${alts.length}개</summary>${inner}</details>`;
  } else if (over(p)) h += `<div class="altbox"><p class="k">10만원 넘는 제품이야. 비슷한 10만원 아래 제품은 아직 못 찾았어</p></div>`;
  if (fb) h += `<details${p.soldAll && !alts.length ? ' open' : ''}><summary>못 살 때 고를 기준</summary><p>핏: ${esc(fb[0])}<br>소재: ${esc(fb[1])}<br>느낌: ${esc(fb[2])}</p></details>`;
  if (isP) h += pantsTable(p);
  h += `<details><summary>소재 · 사이즈 근거</summary><p>소재 ${esc(p.mat || '상품 페이지에서 못 읽음')}</p>${why.length ? `<p>${why.map(esc).join('<br>')}</p>` : ''}`
    + `${p.chartNote ? `<p>${esc(p.chartNote)}</p>` : ''}${facts ? `<p>${esc(facts)}</p>` : ''}</details>`;
  return h;
}
const imgFail = (root, msg) => root.querySelectorAll('img[data-ph]').forEach(im => im.addEventListener('error', () => {
  const s = document.createElement('span'); s.className = 'noimg'; s.textContent = msg || '사진 못 불러옴'; im.replaceWith(s);
}, {once: true}));
const toSet = f => { closeSheet(); $('#set').hidden = false; $('#setBtn').setAttribute('aria-expanded', 'true'); $('#' + (f || 'bh')).focus(); window.scrollTo(0, 0); };
function openSheet(i, keep){
  if (!curLook || !curLook.spots[i]) return;
  sheetI = i; sheetKey = curLook.key;
  const sh = $('#sheet'), box = $('#shIn');
  const top = sh.scrollTop;
  box.innerHTML = cardHTML(curLook, i);
  sh.hidden = false; document.body.classList.add('sheet-open');
  sh.scrollTop = keep ? top : 0;
  document.querySelectorAll('#car .dot').forEach(b => b.setAttribute('aria-pressed', 'false'));
  const slide = document.querySelector(`#car .slide[data-n="${st.lookN}"]`);
  const dot = slide && slide.querySelector(`.dot[data-i="${i}"]`);
  if (dot) dot.setAttribute('aria-pressed', 'true');
  $('#shX').addEventListener('click', () => closeSheet(true));
  box.querySelectorAll('[data-toset]').forEach(b => b.addEventListener('click', () => toSet(b.dataset.toset)));
  imgFail(box);
  // 누른 옷이 카드에 가리지 않게, 그 옷의 점이 카드 위 빈 화면 가운데쯤 오도록 페이지를 올린다
  if (!keep && dot && st.show) {
    const r = sh.getBoundingClientRect();
    // 넓은 화면에선 카드가 오른쪽에 떠 있어서 화면 전체가 빈 자리
    const free = r.left > 0 ? window.innerHeight : window.innerHeight - r.height;
    const y = dot.getBoundingClientRect().top + 20;
    if (y > free - 40 || y < 40) {
      window.scrollBy({top: y - Math.max(60, free * 0.5), behavior: 'smooth'});
      quietUntil = performance.now() + 800;
    }
  }
}
function closeSheet(user){
  const sh = $('#sheet');
  sh.hidden = true; document.body.classList.remove('sheet-open'); sheetI = null;
  document.querySelectorAll('#car .dot').forEach(b => b.setAttribute('aria-pressed', 'false'));
  if (user && lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function bindLook(){
  const car = $('#car');
  if (!car) return;
  // 옆으로 밀어서 멈춘 사진이 지금 코디. 사진 아래 설명·제품 목록만 바꾼다
  let t = null;
  car.addEventListener('scroll', () => {
    clearTimeout(t);
    t = setTimeout(() => {
      const n = Math.max(0, Math.min(curOrder.length - 1, Math.round(car.scrollLeft / car.clientWidth)));
      if (n !== st.lookN) { st.lookN = n; closeSheet(); drawBelow(); }
    }, 90);
  }, {passive: true});
  car.querySelectorAll('.dot').forEach(b => b.addEventListener('click', () => {
    const n = +b.closest('.slide').dataset.n;
    if (n !== st.lookN) { st.lookN = n; drawBelow(); }
    lastFocus = b; openSheet(+b.dataset.i);
  }));
  car.querySelectorAll('.lk img').forEach(im => im.addEventListener('error', () => {
    const s = document.createElement('span'); s.className = 'noimg big'; s.textContent = '코디 사진을 못 불러옴'; im.replaceWith(s);
  }, {once: true}));
}
window.addEventListener('resize', () => { const car = $('#car'); if (car) car.scrollLeft = st.lookN * car.clientWidth; });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(true); });

/* ---------- 시작 ---------- */
buildCity(); buildHours(); buildLevels(); buildBody(); syncSeg('day', st.day); syncSeg('sens', st.sens);
load(true);
})();
</script>
