<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="referrer" content="no-referrer">
<title>오늘 뭐 입지</title>
<style>
:root{--ink:#141414;--sub:#6a6a6a;--line:#e6e6e6;--acc:#1F5C58}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
main{max-width:640px;margin:0 auto;padding:16px 16px 32px}
a{color:var(--acc)}
button,select,input{font:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:19px;margin:0;letter-spacing:-.3px}
.plain{border:1px solid #cfcfcf;background:#fff;border-radius:3px;padding:5px 11px;cursor:pointer}
.plain[aria-expanded=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{display:flex;align-items:center;gap:6px 12px;margin-top:12px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid #cfcfcf;border-radius:3px;overflow:hidden}
.seg button{border:0;border-right:1px solid #cfcfcf;background:#fff;padding:5px 12px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
#where{font-size:13.5px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{border:1px solid #cfcfcf;background:#fff;border-radius:3px;padding:4px 10px;cursor:pointer;font-size:14px}
#set{margin-top:12px;border-top:1px solid var(--line)}
.field{display:flex;align-items:center;gap:6px 8px;margin:9px 0;flex-wrap:wrap}
.lb{width:40px;color:var(--sub);font-size:13px;flex:none}
select,input[type=text]{border:1px solid #cfcfcf;border-radius:3px;padding:5px 7px;background:#fff}
#search{display:none}
#search.on{display:block}
#results{list-style:none;margin:0 0 6px;padding:0}
#results button{border:0;background:none;padding:4px 0;cursor:pointer;color:var(--acc);text-decoration:underline;text-align:left}
section{border-top:1px solid var(--line);padding:14px 0}
#wx{margin-top:14px}
.msg{color:var(--sub);margin:0}
.now{display:flex;align-items:center;gap:10px}
.now svg{width:34px;height:34px;flex:none}
.big{font-size:28px;font-weight:700;margin:0;letter-spacing:-.5px;line-height:1.2}
.big em{font-style:normal;color:var(--acc)}
.sub{margin:4px 0 0;color:var(--sub);font-size:13.5px}
.hrs{display:flex;overflow-x:auto;margin-top:12px;-webkit-overflow-scrolling:touch;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.h{flex:0 0 46px;padding:6px 0 4px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:2px}
.h svg{width:20px;height:20px}
.h b{font-size:14px;color:var(--ink)}
.h b.lo{color:var(--acc)}
.h i{font-style:normal;font-size:11px;min-height:16px}
.k{font-size:12.5px;color:var(--sub);margin:0}
.p1{font-size:17px;margin:2px 0 0}
.p1 b{font-size:19px;margin-right:8px}
ul.more{list-style:none;margin:6px 0 0;padding:0;font-size:13.5px;color:var(--sub)}
ul.more li{margin:2px 0}
ul.more b{color:var(--ink);font-weight:700;margin-right:6px}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;max-width:520px}
.tile{margin:0;min-width:0}
.tile .ph{position:relative;border:1px solid var(--line);background:#fff;aspect-ratio:1/1;overflow:hidden}
.tile img{width:100%;height:100%;object-fit:contain;display:block}
.tile.lead{grid-column:span 2;grid-row:span 2;display:flex;flex-direction:column}
.tile.lead .ph{flex:1 1 0;aspect-ratio:auto;min-height:0}
.tile.lead .ph img{position:absolute;inset:0}
.tile .n{position:absolute;left:5px;top:5px;background:#fff}
.tile figcaption{font-size:12px;color:var(--sub);line-height:1.3;margin-top:3px;overflow-wrap:anywhere}
.noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--sub);padding:6px}
.src{font-size:11.5px;color:var(--sub);margin:6px 0 2px}
ol.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ol.items li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:0 8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
ol.items li:last-child{border-bottom:0}
details.more2 p.altp{display:flex;gap:8px;align-items:flex-start}
.ai{position:relative;flex:none;width:64px;height:64px;border:1px solid var(--line);background:#fff}
.ai img{width:100%;height:100%;object-fit:contain;display:block}
.ai .noimg{font-size:10.5px;padding:2px}
.n{width:19px;height:19px;border:1.4px solid var(--ink);border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.n.x{border-color:transparent}
.sl{display:block;font-size:12px;color:var(--sub)}
.nm{font-weight:700;font-size:14.5px;line-height:1.35}
.cn{font-size:12px;color:var(--sub)}
.how{display:block;font-size:12.5px;color:var(--sub);margin-top:2px}
.pd{display:block;font-size:13px;line-height:1.45;margin-top:3px}
.pd b{font-weight:700}
.pd .sz{color:var(--acc);font-weight:700}
.pd .warn{color:#8a3b12}
.pd + .pd{margin-top:6px;padding-top:6px;border-top:1px dotted #ddd}
details.more2{margin-top:4px;font-size:12.5px;color:var(--sub)}
details.more2 summary{cursor:pointer;color:var(--acc);list-style:none;display:inline}
details.more2 summary::-webkit-details-marker{display:none}
details.more2 summary::before{content:'+ '}
details.more2[open] summary::before{content:'− '}
details.more2 p{margin:5px 0 0;color:#333}
details.more2 p .lbl{display:inline-block;min-width:44px;margin-right:6px;color:var(--sub)}
.note{font-size:12px;color:var(--sub);margin:0 0 8px}
input[type=number]{width:74px;border:1px solid #cfcfcf;border-radius:3px;padding:5px 7px;background:#fff}
/* v17: 키·몸무게·신발 −/+ 버튼(키 150부터 10, 몸무게 60부터 5, 신발 250부터 10). 폰 숫자 칸에는 오르내림 화살표가 없어서 버튼으로 */
.stp{display:inline-flex;align-items:stretch;margin-right:3px;vertical-align:middle}
.stp .sb{width:30px;min-height:30px;border:1px solid #cfcfcf;background:#f4f4f4;color:#222;font-size:16px;line-height:1;padding:0;border-radius:0}
.stp .sb:first-child{border-radius:3px 0 0 3px;border-right:0}
.stp .sb:last-child{border-radius:0 3px 3px 0;border-left:0}
.nw{display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.stp input[type=number]{width:66px;border-radius:0;padding:5px 3px;text-align:center;-moz-appearance:textfield;appearance:textfield}
.stp input::-webkit-inner-spin-button,.stp input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.hint{font-size:12px;color:var(--sub)}
.acts{margin-top:12px}
footer{font-size:11.5px;color:var(--sub);border-top:1px solid var(--line);padding-top:10px}
/* v6: 조건 한 줄 + 착용샷 */
#cond{margin-top:14px}
.cond{font-size:21px;font-weight:700;margin:0;letter-spacing:-.4px;line-height:1.3}
.cond em{font-style:normal;color:var(--acc)}
.key1{margin:4px 0 0;font-size:14.5px}
.key1 b{margin-right:6px}
details.hw{margin-top:8px;font-size:13px}
details.hw summary{cursor:pointer;color:var(--acc);list-style:none;display:inline}
details.hw summary::-webkit-details-marker{display:none}
details.hw summary::before{content:'+ '}
details.hw[open] summary::before{content:'− '}
details.hw .sub{margin-top:6px}
/* v7: 위에는 날짜·날씨 한 줄과 단계만, 사진은 어깨~신발을 크게, 옆으로 밀면 다른 코디 */
main{padding-top:10px}
/* v13: 폰 폭(375px)에서 지역·날씨 글이 한 글자씩 세로로 쌓이던 것 → 자리가 모자라면 다음 줄로 */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top .seg button{padding:4px 9px}
#where{flex:1;min-width:9em;font-size:13.5px;line-height:1.3;color:var(--ink)}
#where em{font-style:normal;color:var(--acc);font-weight:700}
#where .s{color:var(--sub)}
.top .plain{padding:4px 9px;flex:none}
.chips{margin-top:8px}
#look{border-top:0;padding:8px 0 4px}
.car{display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
.car::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;justify-content:center}
.lk{position:relative;width:min(100%,calc((100vh - 150px) * .56));width:min(100%,calc((100svh - 150px) * .56));aspect-ratio:.56;overflow:hidden;background:#eee}
.lk img{position:absolute;display:block;height:auto;max-width:none}
.lk .ref{position:absolute;left:6px;top:6px;background:rgba(255,255,255,.92);color:var(--ink);font-size:12px;line-height:1.3;padding:2px 7px;border-radius:2px}
.lk .dot{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border:0;padding:0;background:transparent;cursor:pointer;display:none;-webkit-tap-highlight-color:transparent}
.lk .dot::before{content:'';position:absolute;left:12px;top:12px;width:16px;height:16px;box-sizing:border-box;border-radius:50%;background:#fff;border:2.5px solid var(--acc);box-shadow:0 0 0 1.5px rgba(0,0,0,.35)}
.lk .dot[aria-pressed=true]::before{background:var(--acc);border-color:#fff}
#look.show .lk .dot{display:block}
.noimg.big{font-size:14px}
.lkbar{display:flex;align-items:center;gap:8px;margin-top:8px}
.lkbar .cnt{font-size:13px;color:var(--sub);flex:1}
.lkbar .plain{padding:6px 11px;font-size:14px}
.lkbar .plain[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.reft{font-size:13.5px;margin:8px 0 0;line-height:1.45}
.reft b{color:#8a3b12;margin-right:6px}
.sortn{font-size:12px;color:var(--sub);margin:6px 0 0}
#look .k{margin-top:10px}
details.lkm{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
details.lkm summary{cursor:pointer;color:var(--acc);list-style:none}
details.lkm summary::-webkit-details-marker{display:none}
details.lkm summary::before{content:'+ '}
details.lkm[open] summary::before{content:'− '}
details.lkm p{margin:6px 0 0;color:#333;font-size:12.5px;line-height:1.5}
.hid{font-size:12px;color:var(--sub)}
.cmp{margin-top:6px;font-size:13px;line-height:1.45}
.cmp b{font-weight:700}
.cmp .d{color:var(--sub)}
table.pc{border-collapse:collapse;width:100%;margin-top:8px;font-size:12.5px}
table.pc th,table.pc td{border-bottom:1px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
table.pc th{color:var(--sub);font-weight:400;white-space:nowrap}
table.pc td.pr{white-space:nowrap;text-align:right}
table.pc th:last-child{text-align:right}
.badge{display:inline-block;font-size:11.5px;border:1px solid #8a3b12;color:#8a3b12;border-radius:2px;padding:0 4px;margin-left:4px;vertical-align:1px}
.badge.g{border-color:#9a9a9a;color:var(--sub)}
.altbox{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.altbox .k{margin:0}
ul.lki{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
ul.lki li{border-bottom:1px solid var(--line)}
ul.lki li > button{display:flex;width:100%;align-items:center;gap:10px;border:0;background:none;padding:8px 0;text-align:left;cursor:pointer}
ul.lki .ai{width:44px;height:52px}
ul.lki .lt{flex:1;min-width:0}
ul.lki .lt b{display:block;font-size:14px;font-weight:700;line-height:1.3}
ul.lki .lt span{font-size:12.5px;color:var(--sub)}
ul.lki .go{color:var(--acc);font-size:13px;flex:none}
ul.lki .lkx{display:flex;align-items:center;gap:10px;padding:8px 0}
ul.lki .lt .lsz{display:block;margin-top:3px}
ul.lki li.lkh{font-size:12.5px;color:var(--sub);padding:10px 0 2px;border-bottom:0}
.alt1{margin-top:10px;padding:8px 0 0;border-top:1px solid var(--line);font-size:13.5px}
.alt1 .k{margin-bottom:4px}
.nolook{margin:0;font-size:14.5px}
.nolook + .acts{margin-top:8px}
details.recs > summary{cursor:pointer;color:var(--acc);font-size:14px;list-style:none}
details.recs > summary::-webkit-details-marker{display:none}
details.recs > summary::before{content:'+ '}
details.recs[open] > summary::before{content:'− '}
details.recs[open] > summary{margin-bottom:10px}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid #bdbdbd;box-shadow:0 -4px 16px rgba(0,0,0,.08);max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#sheet .in{max-width:640px;margin:0 auto;padding:10px 16px calc(14px + env(safe-area-inset-bottom))}
.shh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.shh .k{margin:0}
.shh button{border:1px solid #cfcfcf;background:#fff;border-radius:3px;padding:3px 10px;cursor:pointer;font-size:13px}
.cardm{display:flex;gap:12px;margin-top:8px;align-items:flex-start}
.cardm .ai{width:84px;height:100px}
.cardm .tx{flex:1;min-width:0}
.cardm .nm{display:block}
.cardm .ln{display:block;font-size:13.5px;margin-top:3px}
.cardm .ln .lbl{display:inline-block;min-width:68px;margin-right:4px;color:var(--sub);font-size:12.5px}
.cardm .sz{color:var(--acc);font-weight:700}
.cardm .warn{color:#8a3b12}
.buy{display:inline-block;margin-top:8px;padding:7px 14px;border:1px solid var(--acc);border-radius:3px;color:var(--acc);text-decoration:none;font-size:14px}
#sheet details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:13px}
#sheet details summary{cursor:pointer;color:var(--acc);list-style:none}
#sheet details summary::-webkit-details-marker{display:none}
#sheet details summary::before{content:'+ '}
#sheet details[open] summary::before{content:'− '}
#sheet details p{margin:6px 0 0;color:#333}
.altc{display:flex;gap:10px;margin-top:8px;align-items:flex-start}
.altc .ai{width:56px;height:66px}
.altc .tx{flex:1;min-width:0;font-size:13px;line-height:1.45}
.nottag{display:inline-block;font-size:11px;color:var(--sub);border:1px solid #cfcfcf;border-radius:2px;padding:0 4px;margin-right:4px}
body.sheet-open main{padding-bottom:58vh}
/* 넓은 PC 화면: 카드를 아래에 깔지 않고 본문 오른쪽에 띄워 사진을 가리지 않게 */
@media (min-width:1360px){
#sheet{left:calc(50% + 336px);right:auto;top:16px;bottom:auto;width:min(380px,calc(50% - 352px));max-height:calc(100vh - 32px);border:1px solid #bdbdbd;box-shadow:0 4px 16px rgba(0,0,0,.08)}
#sheet .in{padding:10px 16px 14px}
body.sheet-open main{padding-bottom:32px}
}
@media (max-width:400px){.cond{font-size:19px}.lk .tag{font-size:12.5px;padding:6px 8px}}
@media (max-width:400px){.big{font-size:24px}.board{gap:6px}.nm{font-size:14px}}
.lkbar{flex-wrap:wrap}
.tb{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.tb .plain{padding:5px 10px;font-size:13.5px}
.tb .plain[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.why{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px;font-size:12.5px}
.why span{color:var(--sub);width:100%}
.why button{border:1px solid #cfcfcf;background:#fff;border-radius:12px;padding:2px 9px;font-size:12.5px;cursor:pointer}
.why button[aria-pressed=true]{border-color:var(--acc);color:var(--acc);font-weight:700}
.why .undo{border:0;color:var(--sub);text-decoration:underline;background:none}
.car[hidden],#grid[hidden]{display:none!important}
.gw,.abw{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc,.abc{border:0;background:none;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit}
.gk{position:relative;display:block;width:100%;aspect-ratio:.56;overflow:hidden;background:#f2f2f2}
.gk img{position:absolute;display:block;height:auto;max-width:none}
.gk i,.gk b{position:absolute;left:4px;top:4px;font-style:normal;font-size:11px;background:rgba(255,255,255,.92);padding:1px 5px;border-radius:2px}
.gk b{left:auto;right:4px;color:var(--acc)}
.gl{display:block;font-size:12px;color:var(--sub);margin-top:3px;line-height:1.35}
.gc.no{opacity:.45}
.gc.cur .gk{outline:2px solid var(--acc);outline-offset:-2px}
.ab{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.ab .k{margin:0 0 6px}
.df{color:var(--acc);font-size:12.5px}
#tasteSet .tl{list-style:none;margin:6px 0 0;padding:0;font-size:12.5px;width:100%}
#tasteSet .tl li{margin:3px 0}
#tasteSet .plain{padding:1px 7px;font-size:12px}
/* v9 */
.core{font-size:15px;font-weight:700;margin:8px 0 0;line-height:1.45;letter-spacing:-.2px}
.whyd{font-size:12.5px;color:var(--sub);margin:3px 0 0;line-height:1.45}
.whyd b{color:var(--acc);margin-right:6px}
.plain.sm{padding:2px 8px;font-size:12.5px}
.lkbar .plain{white-space:nowrap}
.lkbar .plain[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.howp{margin-top:8px;border-top:1px solid var(--line);padding-top:4px}
.howp ul{list-style:none;margin:0;padding:0}
.howp li{font-size:14px;line-height:1.5;margin:7px 0;display:grid;grid-template-columns:50px minmax(0,1fr);gap:0 8px}
.howp li b{color:var(--acc);font-size:13px;padding-top:1px}
.howp li .plain{grid-column:2;justify-self:start;margin-top:4px}
.howp li.cn{display:block}
.unk{font-size:12.5px;color:#444;margin:8px 0 0;line-height:1.5;background:#f6f6f6;padding:7px 9px}
.unk b{display:block;color:var(--sub);font-size:12px}
.pair{display:flex;gap:10px;margin-top:10px;align-items:flex-start;border-top:1px dotted #ddd;padding-top:8px}
.pair .gc{flex:none;width:68px}
.pair p{margin:0;font-size:13px;line-height:1.5;flex:1;min-width:0}
.pair p b{display:block;color:var(--acc)}
.pair p .plain{margin-top:4px}
.buyp{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.buyp .k{margin:0}
.buyp .rd{font-size:13.5px;margin:6px 0 0}
.bi{margin-top:10px;padding-top:8px;border-top:1px dotted #ddd;font-size:13.5px}
.bi p{margin:3px 0 0}
.bi .bt{font-size:15px;margin:0}
.bth{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px;max-width:300px}
.ownc{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ownc button{border:1px solid #cfcfcf;background:#fff;border-radius:3px;padding:4px 9px;font-size:13px;cursor:pointer}
.owna{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px}
.owna .k{flex-basis:100%}
.owna select{font-size:13px;padding:4px 6px}
#ownImp{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;max-width:520px;margin:0 auto;background:#fff;border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.18);padding:14px 16px;font-size:14px;line-height:1.55;max-height:70vh;overflow:auto}
#ownImp p{margin:0 0 8px}
#ownImp button{margin:2px 6px 0 0}
#ownImp .ownf{gap:4px}

function colorIn(s){ let best = null, bi = 1e9; for (const c of COL) { const i = s.indexOf(c[0]); if (i >= 0 && (i < bi || (i === bi && c[0].length > best[0].length))) { best = c; bi = i; } } return best; }
const matColor = s => { for (const [re, v] of MAT) if (re.test(s)) return v; return null; };
const known = s => colorIn(s) || matColor(s);
function far(pal, avoid){ if (!avoid.length) return pal[0]; let best = pal[0], bd = -1; for (const c of pal) { const d = Math.min(...avoid.map(h => Math.abs(lum(c[1]) - lum(h)))); if (d > bd) { bd = d; best = c; } } return best; }
const nameParts = n => { const m = n.match(/\(([^)]*)\)/); return {base: n.replace(/\s*\([^)]*\)/, '').trim(), paren: m ? m[1] : ''}; };

function extraKind(n){
  const K = [[/머플러/,'scarf'],[/넥 게이터|넥워머/,'gaiter'],[/반다나/,'bandana'],[/비니/,'beanie'],[/버킷햇/,'bucket'],[/캡/,'cap'],[/장갑/,'gloves'],[/시계/,'watch'],[/백팩/,'backpack'],[/크로스백/,'cross'],[/서류/,'brief'],[/숄더백/,'shoulder'],[/토트백|에코백/,'tote'],[/안경/,'glasses'],[/반지/,'ring'],[/목걸이/,'necklace'],[/벨트/,'belt'],[/양말/,'socks'],[/두르기/,'drape']];
  for (const [re, k] of K) if (re.test(n)) return k;
  return null;
}
/* 고른 옷 → 그림·목록에 쓸 모양과 색 */
function topKind(n){
  const K = [[/터틀넥|하이넥/,'turtle'],[/후드티/,'hood'],[/쿼터집|하프집업/,'qzip'],[/헨리넥/,'henley'],[/럭비/,'rugby'],[/피케|카라/,'polo'],[/베스트/,'vest'],[/브이넥/,'vknit']];
  for (const [re, k] of K) if (re.test(n)) return k;
  if (/셔츠/.test(n) && !/스웻|맨투맨/.test(n)) return 'shirt';
  return 'crew';
}
function resolve(sel, pal, mood){
  const on = sel.outer ? nameParts(sel.outer.n) : null, tn = nameParts(sel.top.n), bn = nameParts(sel.bottom.n), sn = nameParts(sel.shoes.n), en = sel.extra ? nameParts(sel.extra.n) : null;
  // 상의가 '셔츠 + 타이 + 니트'처럼 겹쳐 입는 조합이면 나눠서 그린다
  const parts = tn.base.split(/\s*\+\s*/).filter(p => !/베이스레이어/.test(p));
  const multi = parts.length > 1;
  const shirtP = multi ? parts.find(p => /셔츠/.test(p) && !/스웻/.test(p)) : null;
  const tieP = parts.find(p => /타이$/.test(p)) || null;
  const teeP = multi ? parts.find(p => /티$/.test(p)) : null;
  const mainP = parts.find(p => p !== shirtP && p !== tieP && p !== teeP) || shirtP || parts[0];
  const shirtUnder = !!shirtP && mainP !== shirtP;
  let outerP = on ? on.base : null, innerP = null;
  if (on && /\+/.test(on.base)) { const op = on.base.split(/\s*\+\s*/); innerP = op[0]; outerP = op[1].replace(/\s*레이어드$/, ''); }
  const sp = sn.base.split(/\s*\+\s*/), shoeP = sp[0], sockP = sp[1] || null;

  const K = {outer: outerP && known(outerP), top: known(mainP), bottom: known(bn.base), shoes: known(shoeP), extra: en && known(en.base)};
  // 이름에 색이 없는 옷은 무드 색 조합의 기본색 두 개(pal[0], pal[1]) 안에서, 소품·타이는 세 번째 포인트 색(pal[2])으로 칠한다
  const base = pal.slice(0, 2), accent = pal[2];
  const byDark = base.slice().sort((a, b) => lum(a[1]) - lum(b[1]));
  const shirtC = shirtUnder ? (known(shirtP) || ['화이트','#F4F4F2']) : null;
  const teeC = teeP ? (known(teeP) || ['화이트','#F4F4F2']) : null;
  const near = [K.outer, K.bottom].filter(Boolean).map(c => c[1]);
  const topC = K.top || (shirtC ? far(base, [shirtC[1]]) : near.length ? far(base, near) : base[1]);
  const outerC = outerP ? (K.outer || far(base, [topC[1]])) : null;
  // 롱패딩은 '바지·신발을 같은 어두운 색으로'가 핏 설명이라, 색이 안 정해진 바지·신발은 블랙으로 맞춘다
  const lp = sel.outer && sel.outer.f === 'longpad', BLK = ['블랙','#1C1C1C'];
  const bottomC = colorIn(bn.base) ? K.bottom : lp ? BLK : K.bottom || (byDark[0][1] === topC[1] ? byDark[1] : byDark[0]);
  const shoesC = colorIn(shoeP) ? K.shoes : lp ? BLK : K.shoes || byDark[0];
  const pointC = avoid => avoid.includes(accent[1]) ? far(pal, avoid) : accent;
  const extraC = en ? (K.extra || pointC([(outerC || topC)[1], bottomC[1]])) : null;
  const tieC = tieP ? (known(tieP) || pointC([topC[1], (shirtC || topC)[1]])) : null;

  // v12: 옛 착장 그림을 그리던 값(무늬·기장·겉옷 모양 등)은 지우고, 목록(rows)에 쓰는 값만 남김
  // 상의를 넣어 입는지(벨트 소품을 보여 줄지 정함)
  const tk = topKind(mainP), f = sel.top.f;
  const ek = en ? extraKind(en.base) : null;
  const tuckable = ['shirt','polo','henley','crew','rugby'].includes(tk) && !shirtUnder && !/니트|맨투맨|스웻|플리스|울/.test(mainP);
  const tuckFull = (ek === 'belt' && tuckable) || (tk === 'shirt' && (mood === 'formal' || mood === 'preppy'));
  // 겉옷: '가방에', '손에 들기'는 입지 않은 상태
  const carry = on && /가방|손에/.test(on.paren);
  const O = !!(on && !carry);
  const bk = /조거|트랙 팬츠/.test(bn.base) ? 'jogger' : (sel.bottom.f || 'straight');
  const E = en ? {draw: !!ek && (ek !== 'belt' || tuckFull)} : null;

  // 목록. 이름에 색이 없어서 그림에 정해 넣은 색은 괄호로 밝힌다
  // 이름에 색 단어가 없는데 그림에 색을 정해 넣었으면(소재로 짐작한 색 포함) 괄호로 밝힌다
  const nt = (s, c) => !colorIn(s) && c && !s.includes(c[0]) ? `(${c[0]})` : '';
  // 겹쳐 입는 상의는 제일 넓게 보이는 옷의 색만 적어 목록을 짧게 둔다
  const tnotes = [];
  if (!colorIn(mainP)) tnotes.push(multi ? `${mainP.split(' ').pop()} ${topC[0]}` : topC[0]);
  const rows = [];
  rows.push(sel.outer
    ? {slot:'겉옷', name: on.base, note: O ? nt(outerP, outerC) : '', how: on.paren || HOW[sel.outer.f] || '', kw: sel.outer.kw, drawn: !!O}
    : {slot:'겉옷', name:'없이', note:'', how:'', kw:'', drawn:false});
  rows.push({slot:'상의', name: tn.base, note: tnotes.length ? `(${tnotes.join(' · ')})` : '', how: HOW[f] || '', kw: sel.top.kw, drawn:true});
  rows.push({slot:'하의', name: bn.base, note: nt(bn.base, bottomC), how: bk === 'jogger' ? '' : HOW[sel.bottom.f] || '', kw: sel.bottom.kw, drawn:true});
  rows.push({slot:'신발', name: sn.base, note: nt(shoeP, shoesC), how: sn.paren || (bk === 'shorts' ? '' : HOW[sel.shoes.f]) || '', kw: sel.shoes.kw, drawn:true});
  if (en) rows.push({slot:'소품', name: en.base, note: E.draw ? nt(en.base, extraC) : '', how: en.paren || EXH[ek] || '', kw: sel.extra.kw, drawn: E.draw});
  let n = 0; rows.forEach(r => { if (r.drawn) r.num = ++n; });
  return {rows};
}

let wxNote = '';
// 예보를 못 받을 때만: 달별로 흔한 체감 최저·최고(서울 기준으로 정한 대략값이고 공식 평년값이 아님). 비·바람·습도는 모름(null)
const NORM = [[-10,0],[-7,4],[-2,10],[4,17],[10,22],[16,26],[22,30],[22,31],[15,26],[7,19],[0,11],[-7,3]];
function estWx(){
  const n = localNow(null), [lo, hi] = NORM[+n.date.slice(5, 7) - 1], ds = Array.from({length: 16}, (_, k) => addDays(n.date, k));
  const time = [], feel = [];
  ds.forEach(d => { for (let h = 0; h < 24; h++) { time.push(d + 'T' + pad2(h) + ':00'); feel.push(+(lo + (hi - lo) * Math.max(0, Math.sin(Math.PI * (h - 6) / 18))).toFixed(1)); } });

  return {est: true, utc_offset_seconds: -new Date().getTimezoneOffset() * 60, current: {time: n.date + 'T' + pad2(n.h) + ':00'},
    hourly: {time, temperature_2m: feel, apparent_temperature: feel, precipitation_probability: z(null), precipitation: z(null), weather_code: z(null), wind_speed_10m: z(null), relative_humidity_2m: z(null)},

}
// 예보가 없을 때 직접 고르는 기온(이 기기에만 저장)
const MT = [[-8, '영하 5° 아래'], [0, '0° 안팎'], [5, '5° 안팎'], [10, '10° 안팎'], [15, '15° 안팎'], [21, '20° 위']];
// v18: 다른 계절 미리보기. 오늘 화면만 이 체감(나갈 때 값, 오후엔 몇 도 더)으로 고르고 저장하지 않음. 7일 준비는 실제 예보 그대로
let PV = null;
const PVS = [[-8, '한겨울'], [0, '겨울'], [6, '늦가을·초봄'], [12, '가을·봄'], [17, '초가을·늦봄']];

/* ---------- 계산 ---------- */
const DOW = ['일','월','화','수','목','금','토'];
const r0 = x => Math.round(x);
const deg = x => `${r0(x)}°`;
function hashStr(s){ let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const dist = (i,t) => t < i.lo ? i.lo - t : t > i.hi ? t - i.hi : 0;
function pick(list, t, seed, filt, preferSeasonal, strict){
  let pool = filt ? list.filter(filt) : list.slice();
  let fit = pool.filter(i => t >= i.lo && t <= i.hi);
  if (!fit.length) {
    // 딱 맞는 게 없으면 4° 안쪽으로 벗어난 것만 빌려 온다. strict면 그것도 없을 때 비워서 대체 목록으로 넘긴다.
    const near = pool.slice().sort((a,b) => dist(a,t) - dist(b,t));
    fit = near.filter(i => dist(i,t) <= 4).slice(0,2);
    if (!fit.length && !strict) fit = near.slice(0,1);
  }
  if (!fit.length) return {main:null};
  // 소품: 머플러·장갑·볼캡처럼 그날 날씨에만 맞는 것을 사계절용(시계·가방)보다 먼저
  const seasonal = preferSeasonal ? fit.filter(i => i.hi - i.lo < 60) : [];
  const from = seasonal.length ? seasonal : fit;
  return {main: from[(seed + st.shuffle) % from.length]};
}

// v10: 날짜를 받으면 그날 외출 시간 전체로(7일 준비), 안 받으면 오늘·내일 버튼대로. 그 날짜 시간이 예보에 없으면 nofc
function analyse(dateArg){
  const H = wx.hourly, now = localNow(wx), today = now.date;
  // 미리보기는 날짜 없이 부를 때(오늘 화면)만. 외출 시간이 지나지 않게 내일 시간대를 빌려 씀
  const pv = PV != null && !dateArg;
  const date = dateArg || addDays(today, pv ? 1 : st.day);
  const nowH = now.h;
  let s = st.start, e = st.end;
  let fromNow = false;
  if (!dateArg && date === today && nowH > s) { s = nowH; fromNow = true; }
  if (s > e) return {date, past:true};
  const idx = [];
  H.time.forEach((t,i) => { if (t.slice(0,10) === date) { const h = +t.slice(11,13); if (h >= s && h <= e) idx.push(i); } });
  if (!idx.length) return {date, past: date === today, nofc: date !== today};
  const g = k => idx.map(i => H[k][i]);
  const hours = idx.map(i => +H.time[i].slice(11,13));
  const unkRain = !pv && (!!wx.est || g('precipitation_probability').every(x => x == null));
  let feels = g('apparent_temperature');
  // 예보가 없고 기온을 직접 골랐으면 그 값으로(낮에는 6° 더 따뜻하다고 봄). 미리보기도 같은 식, 비·바람은 없다고 봄
  const mtv = pv ? PV : wx.est ? st.mt : null, z = v => hours.map(() => v);
  const sw = h => 6 * Math.max(0, Math.sin(Math.PI * (h - 6) / 18)), b0 = pv ? sw(hours[0]) : 0;
  if (mtv != null) feels = hours.map(h => mtv + sw(h) - b0);
  const temps = mtv != null ? feels : g('temperature_2m'), prob = pv ? z(0) : g('precipitation_probability').map(x => x ?? 0),
        prec = pv ? z(0) : g('precipitation').map(x => x ?? 0), codes = pv ? z(1) : g('weather_code'), wind = pv ? z(2) : g('wind_speed_10m').map(x => x ?? 0), hum = pv ? z(50) : g('relative_humidity_2m');
  const iMin = feels.indexOf(Math.min(...feels)), iMax = feels.indexOf(Math.max(...feels));
  const pMax = Math.max(...prob), iP = prob.indexOf(pMax);
  const precSum = prec.reduce((a,b) => a+b, 0);
  const di = wx.daily.time.indexOf(date);
  const uv = di >= 0 && !pv ? wx.daily.uv_index_max[di] : null;
  const mins = t => t ? +t.slice(11,13) * 60 + +t.slice(14,16) : null;
  const sr = di >= 0 ? mins(wx.daily.sunrise[di]) : null, ss = di >= 0 ? mins(wx.daily.sunset[di]) : null;
  const worst = codes.reduce((a,c) => sev(c) > sev(a) ? c : a, codes[0]);
  const adj = st.sens;
  return {
    date, s, e, fromNow, hours, feels, temps, prob, prec, codes,
    night: h => sr != null && ss != null && (h * 60 < sr || h * 60 >= ss),
    tOuter: feels[iMin] + adj, hOuter: hours[iMin],
    tTop: feels[iMax] + adj, hTop: hours[iMax],
    tMid: feels.reduce((a,b) => a+b, 0) / feels.length + adj,
    tMinRaw: Math.min(...temps), tMaxRaw: Math.max(...temps),
    feelMinRaw: feels[iMin], feelMaxRaw: feels[iMax],
    diurnal: Math.max(...temps) - Math.min(...temps),
    pMax, hP: hours[iP], precSum,
    rainy: precSum >= 1 || (pMax >= 60 && (precSum >= .3 || codes.some(c => isRainCode(c) && c > 55))), drizzle: codes.some(isRainCode) || precSum >= .1 || pMax >= 50,
    maybeRain: pMax >= 30,
    snowy: codes.some(isSnowCode),
    hSnow: hours[Math.max(0, codes.findIndex(isSnowCode))],
    windMax: Math.max(...wind), humAvg: hum.reduce((a,b) => a+b, 0) / hum.length,
    uv, worst, est: !!wx.est && !pv, unkRain, pv

}

    : `${esc(dLabel)} ${esc(st.city)} <em>체감 ${lo === hi ? lo + '°' : `${lo}°~${hi}°`}</em> <span class="s">${esc(WMO[A.worst] ?? '')}${A.pMax >= 30 ? ` · 강수 ${A.pMax}%` : ''}</span>`;

  const pvRow = wx.est ? '' : `<details class="hw pvw"${A.pv ? ' open' : ''}><summary>${A.pv ? '다른 계절 미리보기 중' : '다른 계절 미리보기'}</summary><div class="mtc">`

    <div class="hrs" aria-label="시간별 체감온도와 강수확률">${hrs}</div></details>`;

  /* ----- 코디 고르기 ----- */

  const seed = hashStr(A.date + st.level);
  let outer;
  const outerT = A.diurnal >= 10 && A.tOuter > -2 ? A.tOuter + 2 : A.tOuter;
  if (A.tOuter >= 24) outer = {main:null};

    const list = A.tOuter >= 20 ? M.outer.filter(i => i.hi >= 21) : M.outer;
    // 비·눈·센 바람엔 바람이 통하고 물을 먹는 니트 겉옷과 스웨이드를 뺀다

  if (A.tTop >= 28 && A.humAvg >= 70) pts.push(['습도', `${r0(A.humAvg)}% · 린넨·시어서커`]);
  if (A.tTop >= 28) pts.push(['실내 냉방', '얇은 셔츠 하나 가방에']);
  const key = M.key;
  const first = pts.length ? pts[0] : key;
  // 제일 중요한 것은 한 줄만 남긴다
  // v10: 예보를 못 받으면 '예보 확인 불가'로 분명히 말하고, 비·눈은 모른다고 함. 기온은 이달 흔한 값 또는 직접 고른 값

  const sel = {outer: outer.main, top: top.main, bottom: bottom.main, shoes: shoes.main, extra: ex.main};
  const R = resolve(sel, pal, M.mood);
  const bySlot = {'겉옷': sel.outer, '상의': sel.top, '하의': sel.bottom, '신발': sel.shoes, '소품': sel.extra};
  // 위에는 고른 제품의 무신사 상품 사진을 번호와 함께 모아 보여 주고, 아래 목록은 같은 번호로 설명한다
  const tiles = [];
  let num = 0;
  const rows = R.rows.map(r => {
    const it = bySlot[r.slot];
    // 제품 줄 → 입는 법 → 접힌 칸(대체·못 살 때) 순서. 겹쳐 입는 상의는 제품 두 개
    const specs = it && it.sp ? [it.sp].concat(it.sp2 ? [it.sp2] : []) : [];
    const full = it && it.sp2 ? it.n.split(/\s*\+\s*/) : [];
    const ps = specs.map((s, j) => prodHTML(s, full[j] ? full[j].split(' ').pop() : '')).filter(Boolean);
    const n = ps.length ? ++num : 0;
    specs.forEach((s, j) => { const m = PBY[s] && PBY[s].main; if (m) tiles.push({n, m, cap: full[j] || r.name, big: r.slot === '겉옷'}); });
    return `<li><span class="n${n ? '' : ' x'}">${n || ''}</span><div><span class="sl">${r.slot}${r.name !== '없이' ? ' · ' + esc(r.name) : ' 없이'}</span>`
      + ps.map(p => p.h).join('') + (r.how ? `<span class="how">${esc(r.how)}</span>` : '') + ps.map(p => p.d).join('')
      + `</div></li>`;
  }).join('');
  const board = `<div class="board" role="list" aria-label="오늘 코디 제품 사진">` + tiles.map(t => `<figure class="tile${t.big ? ' lead' : ''}" role="listitem">`
    + `<div class="ph">${photo(t.m, t.big ? 640 : 320, '')}<span class="n">${t.n}</span></div><figcaption>${esc(t.cap)}</figcaption></figure>`).join('') + '</div>'
    + `<p class="src">사진은 제품마다 무신사 상품 페이지 대표 사진이라 모델이 다름</p>`;
  // 넣어 둔 제품이 겨울용이라, 그보다 따뜻한 날엔 그렇다고 적는다
  const topHi = Math.max(...M.top.map(i => i.hi));
  const warm = A.tTop > topHi + 2 ? `<p class="note">넣어 둔 제품은 겨울용이라 오늘 낮 체감 ${ft}엔 두꺼울 수 있음</p>` : '';
  const dates = [...new Set(PRODUCTS.map(p => p.checked))];
  const dTxt = dates.length === 1 ? `${+dates[0].slice(5, 7)}월 ${+dates[0].slice(8, 10)}일` : '제품마다 다른 날짜에 확인한';
  const needBody = (!st.bh || !st.bw || !st.bf) ? ` · <button class="plain" type="button" id="toSet" style="padding:1px 7px;font-size:12px">키·몸무게·발 넣기</button> 넣으면 내 사이즈가 나옴` : '';
  const recs = `<p class="note">가격은 ${dTxt} 무신사 판매가(쿠폰·적립 전)${needBody}</p>${warm}
    ${board}<ol class="items">${rows}</ol>
    <div class="acts"><button class="plain" type="button" id="shuf">다른 조합</button></div>`;

  /* ----- 착용샷 ----- */
  // 같은 단계의 착용샷을 전부 옆으로 넘겨 보게 한다. 오늘 체감(겉옷 기준)이 사진 온도 범위에서 2° 안쪽인 것부터,
  // 그다음은 범위에서 가까운 순서로 '참고 코디'. 바지 실측·핏을 넣었으면 같은 날씨 묶음 안에서 비교할 수 있는 것부터
  curA = A;
  curOrder = keepHead(orderLooks(A), st.lookN);
  if (st.lookN >= curOrder.length) st.lookN = 0;
  const prevKey = sheetKey, prevI = sheetI;
  // 30분마다 날씨를 다시 받아도 사진 순서가 같으면 사진은 그대로 두고 아래 설명만 바꾼다(사진이 깜빡이지 않게)
  const sig = curOrder.map(o => o.L.key + (o.dd > 2 ? '*' : '')).join(',');
  const old = $('#car');
  if (curOrder.length) {
    if (!(old && old.dataset.sig === sig)) {
      $('#look').innerHTML = carHTML();
      bindLook();
    }
    $('#look').classList.toggle('show', st.show);
    $('#outfit').innerHTML = `<details class="recs"><summary>사진 없이 날씨로 고른 제품 추천 보기</summary>${recs}</details>`;
  } else {
    $('#look').innerHTML = `<p class="nolook">이 단계에 등록된 착용샷이 없어.</p>`;
    $('#outfit').innerHTML = `<p class="k" style="margin-bottom:8px">날씨로 고른 제품 추천 (착용샷 아님)</p>` + recs;
  }
  $('#look').hidden = false;
  const car = $('#car');
  if (car && Math.round(car.scrollLeft / Math.max(1, car.clientWidth)) !== st.lookN) car.scrollLeft = st.lookN * car.clientWidth;
  drawBelow();
  if (st.grid) setGrid(true);
  if (prevI != null && curLook && curLook.key === prevKey && curLook.spots[prevI]) openSheet(prevI, true); else closeSheet();
  $('#outfit').hidden = false;
  // 사진이 안 뜨면 깨진 아이콘 대신 글자로 알린다
  $('#outfit').querySelectorAll('img[data-ph]').forEach(im => im.addEventListener('error', () => {
    const s = document.createElement('span'); s.className = 'noimg'; s.textContent = '사진 못 불러옴'; im.replaceWith(s);
  }, {once: true}));
  $('#shuf').addEventListener('click', () => { st.shuffle++; render(); });
  const ts = $('#toSet');
  if (ts) ts.addEventListener('click', () => { $('#set').hidden = false; $('#setBtn').setAttribute('aria-expanded', 'true'); $('#bh').focus(); window.scrollTo(0, 0); });
}

/* ---------- 제품·사이즈 ---------- */
// v11: 상품 페이지에서 사이즈 칸에 같이 긁혀 온 가격·배송 문구('99,900원', '예약배송')는 사이즈가 아니라서 뺀다
PRODUCTS.forEach(p => { if (Array.isArray(p.sizes)) p.sizes = p.sizes.filter(s => !/원$|배송|품절|^\s*$/.test(String(s))); });
const PBY = {};
PRODUCTS.forEach(p => { (PBY[p.spec] = PBY[p.spec] || {})[p.role] = p; });
const won = n => Number(n).toLocaleString('ko-KR') + '원';
const purl = id => `https://www.musinsa.com/products/${encodeURIComponent(id)}`;
const lnk = (p, t) => `<a href="${purl(p.id)}" target="_blank" rel="noopener noreferrer">${t}</a>`;
// 사진은 무신사 이미지 서버에서 바로 불러온다(저장소에 안 올림). 상품 페이지에 고른 색만 찍힌 사진이 없으면 빈칸에 그렇게 적는다
const IMG = 'https://image.msscdn.net/images/';
function photo(p, w, lazy){
  if (!p.img || p.img.indexOf(IMG) !== 0) return `<span class="noimg">이 색 사진 없음</span>`;
  const src = 'https://image.msscdn.net/thumbnails/images/' + p.img.slice(IMG.length) + '?w=' + w;
  return `<img data-ph src="${esc(src)}" alt="${esc(shortName(p.name))}" referrerpolicy="no-referrer"${lazy ? ' loading="lazy"' : ''} decoding="async">`;
}
// '무신사 스탠다드(MUSINSA STANDARD) …'처럼 한글 브랜드 뒤에 붙은 영문 브랜드만 뺀다. '(BLACK)' 같은 색은 남긴다
const shortName = n => n.replace(/^([가-힣]+(?: [가-힣]+)?)\(([A-Z][A-Z0-9 &.'\-]*)\)\s*/, (m, k, e) => /BLACK|WHITE|GR[AE]Y|NAVY|BROWN|BEIGE|IVORY|CHARCOAL|KHAKI|CREAM/.test(e) ? m : k + ' ');

// 옷: 후기에 적힌 키·몸무게·산 사이즈·사이즈 평가로, 내 키·몸무게와 가까운 후기를 골라 계산한다
function clothSize(p){
  const S = p.sizes || [];
  if (p.glove) return {t:'손 크기로 고르기', why:'장갑은 손 크기 기준이라 키·몸무게로 계산 안 함. 사이즈 ' + S.join(' · ')};
  if (S.length <= 1) return {t: S[0] || '', k: S.length ? 0 : null, why: ''};
  if (p.pick) return {t: p.pick, why: '보이는 후기에서 산 옵션이 ' + p.pick + ' 위주'};
  if (!st.bh || !st.bw) return {t:'', why:''};
  // 'Short ver. 50'처럼 앞에 기장 옵션이 붙은 후기는 뒤의 사이즈로 본다
  const si = s => { const i = S.indexOf(s); return i >= 0 ? i : S.indexOf(s.split(' ').pop()); };
  const rv = (p.rv || '').split(';').filter(Boolean).map(x => { const [h, w, s, f] = x.split(','); return {h:+h, w:+w, s, f: isFinite(+f) ? +f : 0, i: si(s)}; }).filter(r => r.i >= 0);
  rv.forEach(r => { r.d = Math.hypot((r.h - st.bh) / 4, (r.w - st.bw) / 5); });
  rv.sort((a, b) => a.d - b.d);
  let use = rv.filter(r => r.d <= 1.5).slice(0, 5), loose = false;
  if (!use.length) { use = rv.filter(r => r.d <= 3).slice(0, 3); loose = true; }
  if (!use.length) return {t:'실측표로 고르기', why:'키·몸무게가 가까운 후기가 없음'};
  // '조금 큼'이면 0.4치수 작게, '조금 작음'이면 0.4치수 크게 본다(후기 하나로 한 치수를 바꾸지 않게)
  let sw = 0, sx = 0;
  use.forEach(r => { const wt = 1 / (0.4 + r.d); sw += wt; sx += wt * (r.i - 0.4 * r.f); });
  const k = Math.min(S.length - 1, Math.max(0, Math.round(sx / sw)));
  const fw = f => f > 0 ? ' 큼' : f < 0 ? ' 작음' : '';
  // v11: 체형이 좀 먼 후기로만 짐작한 건 ref(참고)로 표시해서 확정 사이즈처럼 보이지 않게.
  // 계산에 쓰는 후기는 그대로 두고, 가장 가까운 후기도 키 4cm 안팎(또는 키·몸무게 3씩) 넘게 차이 나면 참고로만 보여 줌
  const ref = loose || use[0].d > 1.0;
  return {t: S[k], k, ref, why: `키·몸무게 가까운 후기 ${use.length}개: ` + use.map(r => `${r.h}cm ${r.w}kg ${r.s}${fw(r.f)}`).join(', ') + (ref ? ' (체형 차이가 좀 있어 참고만)' : '')};
}
// 신발: 평소 신는 사이즈와 같은 옵션(v11: 입력 이름을 '발 길이'에서 바꿈. 실제 발 길이를 넣으면 작게 나와서), 없으면 후기에 '큼'이 많을 때 작은 쪽
function shoeSize(p){
  if (!st.bf) return {t:'', why:''};
  let opts = (p.stock || '').split(' ').filter(Boolean).map(x => ({mm: parseInt(x, 10), out: /x$/.test(x)}));
  // v11: 코디 사진에서 온 신발은 재고 문자열(stock) 대신 sizes·out 목록만 있음. 둘을 합쳐 mm 옵션으로 본다('230/M4W6' → 230)
  if (!opts.length) {
    // v12: '42(270)'처럼 유럽 사이즈 옆 괄호에 mm가 적힌 옵션은 괄호 안 숫자를 씀(앞의 42만 읽어서 '유럽 표기'로 빠지던 문제)
    const mm = s => { const m = String(s).match(/\((\d{3})/); return m ? +m[1] : parseInt(String(s), 10); }, outS = new Set((p.out || []).map(mm));
    const lab = {}; (p.sizes || []).concat(p.out || []).forEach(s => { const v = mm(s); if (/\(\d{3}/.test(String(s))) lab[v] = String(s).replace(/\((\d{3})\)?/, '($1)'); });
    const all = [...new Set((p.sizes || []).concat(p.out || []).map(mm))].filter(v => v >= 200 && v <= 320);
    opts = all.map(v => ({mm: v, out: outS.has(v), lab: lab[v]}));
    if (!opts.length && (p.sizes || []).some(s => mm(s) >= 35 && mm(s) <= 48)) return {t:'', note: '유럽 사이즈 표기', why: `사이즈가 유럽 표기(${p.sizes[0]}~${p.sizes[p.sizes.length - 1]})라 평소 사이즈로 바로 못 고름. 상품 페이지의 mm 환산표 확인`};
  }
  opts.sort((a, b) => a.mm - b.mm);
  if (!opts.length) return {t:'', why:''};
  const rv = (p.rvShoe || '').split(';').filter(Boolean).map(x => { const [mm, fit, ball] = x.split(','); return {mm:+mm, fit, ball}; });
  const n = rv.length, big = rv.filter(r => /큼/.test(r.fit)).length, small = rv.filter(r => /작음/.test(r.fit)).length;
  const F = st.bf, why = [];
  let o = opts.find(x => x.mm === F);
  if (!o) {
    const lower = opts.filter(x => x.mm < F).pop(), upper = opts.find(x => x.mm > F);
    o = lower && (!upper || (n && big * 2 >= n)) ? lower : upper;
    why.push(`${F}mm 옵션이 없어서 ${o.mm}`);
  }
  if (n) why.push(`보이는 후기 ${n}개 중 '큼' ${big} · '작음' ${small}`);
  if (n && big * 2 >= n && opts.some(x => x.mm === o.mm - 5 && !x.out)) why.push(`${o.mm - 5}도 고려`);
  const wide = rv.filter(r => /넓음/.test(r.ball)).length, narrow = rv.filter(r => /좁음/.test(r.ball)).length;
  if (n) why.push(`발볼 '넓음' ${wide} · '좁음' ${narrow}`);
  if (o.out) why.push(`${o.mm}은 ${p.checked ? md(p.checked) + ' 확인 때' : '확인 때'} 품절`);
  if (o.lab) why.push(`상품 페이지 옵션 이름은 ${o.lab}`);
  return {t: String(o.mm), out: o.out, why: why.join(' · ')};
}
const sizeOf = p => isShoe(p) ? shoeSize(p) : clothSize(p);
function chartLine(p, z){
  const c = p.chart;
  if (!c || !c.rows || z.k == null) return '';
  const S = p.sizes || [];
  const ri = p.rowNames ? p.rowNames.indexOf(S[z.k]) : c.rows.length === S.length ? z.k : -1;
  if (ri < 0 || !c.rows[ri]) return '';
  return `${esc(z.t)} 실측: ` + c.cols.map((h, j) => `${esc(h)} ${c.rows[ri][j]}`).join(' · ') + 'cm';
}
function optTxt(p){
  const a = [];
  const low = p.name.toLowerCase();
  if (p.color && !low.includes(String(p.color).toLowerCase())) a.push(p.color);
  if (p.option) a.push('옵션 ' + p.option);
  return a.join(' · ');
}
function sizeTxt(z){
  if (!z.t) return '';
  return `<span class="sz${z.ref ? ' ref' : ''}">${esc(z.t)}</span>${z.ref ? ' <span class="cn">참고</span>' : ''}${z.out ? ' <span class="warn">(품절)</span>' : ''}`;
}
function prodHTML(spec, label){
  const g = PBY[spec];
  if (!g || !g.main) return '';
  const m = g.main, a = g.alt, zm = sizeOf(m), za = a ? sizeOf(a) : null;
  const meta = (p, z) => [optTxt(p) && esc(optTxt(p)), sizeTxt(z), won(p.price)].filter(Boolean).join(' · ');
  let s = `<span class="pd">${label ? `<span class="cn">${esc(label)}</span> ` : ''}<b>${esc(shortName(m.name))}</b><br>${meta(m, zm)} ${lnk(m, '무신사 ↗')}`
    + (m.priceNote ? `<br><span class="cn">${esc(m.priceNote)}</span>` : '')
    + (m.warn ? `<br><span class="warn">${esc(m.warn)}</span>` : '') + '</span>';
  const fb = FB[spec];
  const why = [zm.why, chartLine(m, zm)].filter(Boolean);
  const facts = [m.fitPct, m.reviewCount ? `후기 ${Number(m.reviewCount).toLocaleString('ko-KR')}개` : '', m.sold ? `누적판매 ${m.sold}` : ''].filter(Boolean).join(' · ');
  const d = `<details class="more2"><summary>${label ? esc(label) + ' ' : ''}대체 상품 · 못 살 때</summary>`
    + (a ? `<p class="altp"><span class="ai">${photo(a, 160, 1)}</span><span><span class="lbl">대체</span>${esc(shortName(a.name))} · ${meta(a, za)} ${lnk(a, '↗')}`
      + (a.priceNote ? `<br><span class="cn">${esc(a.priceNote)}</span>` : '')
      + (a.warn ? `<br><span class="warn">${esc(a.warn)}</span>` : '')
      + `<br><span class="cn">소재 ${esc(a.mat)}${a.claim ? ' · ' + esc(a.claim) : ''}${a.optNote ? ' · ' + esc(a.optNote) : ''}</span>`
      + (za && za.why ? `<br><span class="cn">${esc(za.why)}</span>` : '') + '</span></p>' : '')
    + (fb ? `<p><span class="lbl">못 사면</span>핏: ${esc(fb[0])}<br>소재: ${esc(fb[1])}<br>느낌: ${esc(fb[2])}</p>` : '')
    + `<p><span class="lbl">대표 소재</span>${esc(m.mat)}${m.claim ? '<br>' + esc(m.claim) : ''}${m.optNote ? '<br>' + esc(m.optNote) : ''}</p>`
    + (why.length ? `<p><span class="lbl">사이즈</span>${why.map(esc).join('<br>')}</p>` : '')
    + (facts ? `<p><span class="lbl">제품</span>${esc(facts)}</p>` : '')
    + '</details>';
  return {h: s, d};
}

/* ---------- 착용샷 + 아래 카드 (v8) ---------- */
const PID = {};
PRODUCTS.forEach(p => { if (!PID[p.id]) PID[p.id] = p; });
let curLook = null, curOrder = [], curA = null, sheetI = null, sheetKey = null, lastFocus = null, quietUntil = 0, ordSig = '';
const md = d => `${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일`;
const THUMB = (path, w) => 'https://image.msscdn.net/thumbnails/images/' + path + '?w=' + w;
const MIMG = path => 'https://image.msscdn.net/thumbnails/' + path + '?w=600';
const AR = 0.56;          // 사진 칸 가로:세로. 어깨~신발이 폰 화면 높이에 맞게 들어가는 비율
const LIMIT = 100000;     // 10만원. 신발(스니커즈·더비·로퍼)·데님·가방·시계처럼 여러 계절 쓰는 것만 예외
const FITS = {straight:'스트레이트', wide:'와이드', tapered:'테이퍼드', balloon:'벌룬', flare:'플레어'};
// 바지 핏은 무신사 상품명에 적힌 말로만 나눈다. 이름에 없으면 모른다고 적는다
const fitOf = p => /플레어/.test(p.name) ? 'flare' : /테이퍼드/.test(p.name) ? 'tapered' : /벌룬/.test(p.name) ? 'balloon' : /와이드/.test(p.name) ? 'wide' : /스트레이트/.test(p.name) ? 'straight' : '';
const fitTxt = p => { const f = fitOf(p); return (f ? FITS[f] : PFIT[p.id] ? `사진 속 실루엣은 ${PFIT[p.id]} (이름엔 핏 표기 없음)` : '이름에 핏 표기 없음') + (/밴딩/.test(p.name) ? ' · 밴딩' : ''); };
const pantsOf = L => { const s = L.spots.find(x => x.pants); return s && PID[s.id]; };
const sgn = d => { const v = +d.toFixed(2); return v === 0 ? '같음' : (v > 0 ? '+' : '−') + Math.abs(v) + 'cm'; };
const pct = v => (v * 100).toFixed(2) + '%';

const elasticW = p => (/밴딩/.test(p.name) && !/히든 ?밴딩/.test(p.name)) || /스웨트|스웻|조거|트레이닝|라운지|이지 ?팬츠/.test(p.name);

function fitScore(L){

  if (!q || !q.row) return r;
  if (st.pl && q.iL >= 0) { r.d += Math.abs(q.row[q.iL] - st.pl); r.cmp = true; }

// 연달아 나올 때: 같은 겉옷은 같은 사진처럼 보여서 크게, 같은 바지는 기본템 재사용이라 작게, 겉옷·바지가 다 같으면(같은 조합) 아주 크게 뒤로
const sameId = (a, b, r) => a.spots.some(s => ROLE[s.id] === r && b.spots.some(t => t.id === s.id));
const shareItem = (a, b) => sameId(a, b, 'outer') || sameId(a, b, 'pants');
const sharePen = (a, b) => { const o = sameId(a, b, 'outer'), p = sameId(a, b, 'pants'); return o && p ? 2.5 : o ? 1 : p ? .35 : 0; };
function simPen(a, b){
  const F = FEAT[a.key], G = FEAT[b.key]; if (!F || !G) return 0;
  // 겉옷 종류와 기장이 같으면(롱코트 다음 롱코트) 사진을 넘겨도 같은 옷처럼 보여서 더 뒤로
  return (F.ot === G.ot && F.pc === G.pc ? .5 : F.ot === G.ot ? .2 : 0) + (F.ot === G.ot && F.ol === G.ol ? .3 : 0) + (F.pm === G.pm && F.pc === G.pc ? .25 : 0);
}
// 날씨 먼저(체감이 사진 온도 범위에서 2° 안쪽) → 그 안에서 취향·실측·구매 가능·최근 본 것 → 같은 옷·비슷한 조합이 연달아 안 나오게
function orderLooks(A, lv){

  // v9: 기본안 점수(base)가 먼저, 취향·실측·가진 옷은 그 안에서 조정. 날씨는 묶음(g0/g1)으로 이미 걸러짐
  const all = LOOKS.filter(L => L.level === lv).map((L, i) => {

    const fit = useFit ? (f.pf ? .8 : 0) + (f.cmp ? .3 - Math.min(.3, f.d / 20) : 0) : 0;

// 이미 넘겨 본 앞부분은 그대로 두고 뒤만 새 순서로(보고 있는 사진이 갑자기 바뀌지 않게)
function keepHead(fresh, n){

  if (sig !== ordSig || !curOrder.length) { ordSig = sig; return fresh; }
  const head = curOrder.slice(0, n + 1).map(o => fresh.find(x => x.L.key === o.L.key)).filter(Boolean);
  // 예보가 바뀌어 본 사진이 오늘 날씨 밖으로 밀려났으면(맞는 코디 ↔ 참고 코디) 그냥 새 순서로

      + `<p>쓰는 날 ${esc(i.days.sort().map(dLab).join(', '))} · 코디 ${new Set(i.uses.map(u => u.L)).size}벌${p ? ` (${[ex ? `사진 속 제품 그대로 ${ex}번` : '',
        ot ? `같은 칸을 이 제품으로 대신 ${ot}번${dn ? `, 그중 ${dn}번은 사진과 ${esc([...new Set(i.uses.filter(u => u.diff).map(u => u.diff))].join(' · '))}` : ''}` : '',
        lk ? `모양·색만 보이는 칸에 같이 ${lk}번` : ''].filter(Boolean).join(' · ')})` : ''}`
      + (late.length ? `<br><span class="warn">${late.map(dLab).join(', ')}엔 아직 못 받아(도착 당일도 나가기 전에 받을지 몰라서 뺌). 그날 칸에서 대신 입을 것을 확인해</span>` : '')
      + `${i.others.size ? `<br><span class="cn">그 코디에 더 필요한 것: ${esc([...i.others].join(', '))}</span>` : ''}</p>`
      + (p ? `<div class="altc"><span class="ai">${photo(p, 160, 1)}</span><span class="tx"><span class="nottag">${ex && ot ? '한 코디의 사진 속 제품 · 다른 코디엔 대신' : ex ? KN.exact : KN[i.kind] || ''}</span><b>${esc(shortName(p.name))}</b>`
        + `${i.why ? `<br><span class="cn warn">${i.kind === 'mood' ? `사진과 달라지는 점: ${esc(i.why)} · 같은 종류·색은 10만원 아래로 못 찾아서 코디에 골라 둔 대안으로 바꿈` : `확인 못 한 특징: ${esc(i.why)} · 상품 페이지 사진으로 확인`}</span>` : ''}${i.over ? `<br><span class="cn">${esc(i.over)}. 그래서 대신 고름</span>` : ''}`
        + `<br>${i.col && i.col !== '?' ? `색 ${esc(CN[i.col] || i.col)} · ` : ''}${sizeLine(p)} · ${won(p.price)} <span class="cn">${md(p.checked)} 확인 가격·재고${p.price > LIMIT ? ' · 예산 예외 품목' : ''}</span> · ${lnk(p, '무신사 ↗')}`
        + `<br>${buyActs(i.k, i.slot, i.slots)}</span></div>` : `<p class="cn">10만원 아래로 살 수 있는 같은 종류·색 제품을 못 찾았어${i.why ? ` (${esc(i.why)})` : ''}</p>`)
      + '</div>';
  }).join('') + '</div>';
  return h;
}
function bindWeek(){
  const box = $('#week');
  const redraw = keep => { const y = window.scrollY; showWeek(); if (keep) window.scrollTo(0, y); };
  box.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || !box.contains(b)) return;
    if (b.dataset.toset) { toSet(b.dataset.toset); return; }
    const sel = WK.sel, D = WK.days[sel] = WK.days[sel] || {};
    if (b.dataset.day) { WK.sel = b.dataset.day; saveW(); redraw(true); return; }
    if (b.closest('#wstart')) { WK.start = b.dataset.v || null; WK.sel = null; saveW(); redraw(); return; }
    if (b.closest('#wgap')) { WK.gap = +b.dataset.v; saveW(); planWeek(true); redraw(true); return; }
    if (b.closest('#wvary')) { WK.vary = !!+b.dataset.v; saveW(); planWeek(true); redraw(true); return; }
    if (b.closest('#wadj')) { WK.adj = !!+b.dataset.v; saveW(); planWeek(true); redraw(true); return; }
    if (b.id === 'wre') { planWeek(true); redraw(true); return; }
    if (b.id === 'wthrift') { WK.thriftFrom = weekBuy(planWeek(false)).sumTodo; WK.thrift = true; saveW(); planWeek(true); redraw(true); return; }
    if (b.dataset.lv) { if (b.dataset.lv === 'skip') D.skip = !D.skip; else { D.skip = false; if (b.dataset.lv === st.level) delete D.lv; else D.lv = b.dataset.lv; D.pin = false; delete D.why; } saveW(); redraw(true); return; }
    if (b.id === 'wpin') { D.pin = !D.pin; delete D.why; saveW(); redraw(true); return; }
    if (b.id === 'wnext' || b.id === 'wprev') { const p = planWeek(false).find(x => x.d === sel), c = (p.cand || []).filter(o => o.dd <= 2), i = c.findIndex(o => o.L === p.L), st1 = b.id === 'wprev' ? -1 : 1;
      if (c.length > 1) { D.key = c[(i + st1 + c.length) % c.length].L.key; D.pin = true; delete D.why; } saveW(); redraw(true); return; }
    if (b.dataset.swap) { D.key = b.dataset.swap; D.pin = true; delete D.why; saveW(); redraw(true); return; }
    if (b.dataset.have) { OWN.s[b.dataset.have] = 'similar'; saveO(); redraw(true); return; }
    if (b.dataset.unhave) { delete OWN.s[b.dataset.unhave]; delete OWN.f[b.dataset.unhave]; saveO(); redraw(true); return; }
    if (b.dataset.nosub) { OWN.x[b.dataset.nosub] = 1; saveO(); redraw(true); return; }
    if (b.dataset.ownx) { const op = !!b.closest('details[open]'); ownDel(b.dataset.ownx); redraw(true); if (op) { const d = $('#week details.ownw'); if (d) d.open = true; } return; }
    if (b.dataset.wash) { const k = b.dataset.wash, a = wDays(k).slice(), j = a.indexOf(sel); if (j >= 0) a.splice(j, 1); else a.push(sel);
      const t0 = localNow(wx).date, keep = a.filter(x => x >= t0).sort(); if (keep.length) OWN.w[k] = keep; else delete OWN.w[k]; saveO(); redraw(true); return; }
    if (b.dataset.bst != null) { const wrap = b.closest('.bact'), k = wrap.dataset.k, v = b.dataset.bst;
      if (!v) { delete OWN.d[k]; if (OWN.p[k] === 'own') delete OWN.p[k]; }
      else { const o = OWN.d[k] || {}, ss = (wrap.dataset.slots || '').split(',').filter(Boolean);
        OWN.d[k] = Object.assign(o, {st: v, slot: wrap.dataset.slot || o.slot, slots: [...new Set((o.slots || []).concat(ss))], at: localNow(wx).date}); }
      if (v === 'got') OWN.p[k] = 'own';
      saveO(); redraw(true); return; }
  });
  box.addEventListener('change', e => {
    const t = e.target;
    if (t.matches('[data-eta]')) { const k = t.closest('.bact').dataset.k; OWN.d[k] = Object.assign(OWN.d[k] || {st: 'ordered'}, {eta: t.value || null}); saveO(); redraw(true); }
    else if (t.id === 'wdate') { WK.start = t.value || null; WK.sel = null; saveW(); redraw(); }
    else if (t.id === 'wbud') { const v = parseInt(t.value, 10); WK.budget = isFinite(v) && v > 0 ? v : null; if (WK.budget == null) { WK.thrift = false; WK.thriftFrom = null; } saveW(); redraw(true); }
  });
}
